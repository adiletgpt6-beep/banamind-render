name: BalaGo-50 BG-018 (выпуск №19, «Семейный чат»)

# Собирается ТОЛЬКО композиция BalaGoBG018 (src/campaign50/bg-018/index.ts).
# Прежние ролики и другие выпуски партии здесь не рендерятся; массовый
# render.yml эти пути игнорирует (paths-ignore campaign50).
#   voice   → реплики ElevenLabs готовыми кыргызскими голосами проекта;
#             готовые (тот же хэш текста/голоса/настроек) не синтезируются,
#             новые файлы сохраняются в ветку.
#   render  → lint/TypeScript, тесты, контрольные кадры, MP4 1080×1920 и
#             облегчённая копия 540×960 (обе с faststart) + проверка формата.
#   publish → оба MP4 файлами предварительного релиза campaign50-bg-018-preview
#             (прямые ссылки на MP4, не ZIP).

on:
  push:
    branches-ignore:
      - main
    paths:
      - "src/campaign50/bg-018/**"
      - "scripts/campaign50/bg-018/**"
      - "public/audio/campaign50/bg-018/**"
      - ".github/workflows/campaign50-bg-018.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-018-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-018
  ENTRY: src/campaign50/bg-018/index.ts

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-018/generate-voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-018 ]; then git add public/audio/campaign50/bg-018; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(bg-018): save voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript (only this episode)
        run: npx eslint src/campaign50/bg-018 && npx tsc

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (texts, timeline, voice files)
        env:
          BG18_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-018/bg-018.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames
        run: node scripts/campaign50/bg-018/render-stills.mjs

      - name: Render MP4 (H.264/AAC, yuv420p)
        run: npx remotion render "$ENTRY" BalaGoBG018 "out/$OUT.mp4" --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac --log=warn

      - name: Faststart + mobile copy (540×960)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile.mp4"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/campaign50/bg-018/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-018/verify.mjs "out/$OUT-mobile.mp4" --mobile
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-018-mp4
          path: |
            out/balago-bg-018.mp4
            out/balago-bg-018-mobile.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-018-frames
          path: out/frames-bg-018/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-018-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: campaign50-bg-018-preview
        run: |
          ls -la out
          NOTES="BalaGoBG018 (выпуск №19, «Семейный чат») — предварительный просмотр. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №19 — BG-018 «Семейный чат» (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$OUT.mp4" "out/$OUT-mobile.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-mobile.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
