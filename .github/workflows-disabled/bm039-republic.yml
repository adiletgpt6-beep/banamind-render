name: BanaMind BM-039 — Платон «Государство» (банан, 30 мин, 16:9)

# Анимационный фильм BanaMind (не реклама BalaGo): правила BalaGo о контактах,
# Бишкеке и кыргызской озвучке к нему не применяются.
# Своя точка входа Remotion src/bm039-republic/index.ts, другие фильмы не трогает.
#   voice    → озвучка ElevenLabs (тот же голос банана, что в BM-001) по репликам;
#              готовые реплики с тем же хэшем переиспользуются, новые сохраняются в ветку.
#   render   → 10 параллельных частей кадров (без звука), 1920×1080 30 fps.
#   assemble → склейка без пережатия, звук по тайм-лайну, AAC + faststart, SRT,
#              проверка формата/длительности/звука, облегчённая копия, приватный
#              пре-релиз bm039-plato-republic (репозиторий приватный).
# Запуск только явно: вручную (workflow_dispatch) или коммитом с «[ci voice]» в сообщении —
# чтобы обычные правки не перезаписывали локальную озвучку и не тратили минуты Actions.
# В сообщении коммита «[no render]» — только озвучка и проверки.

on:
  push:
    branches:
      - feature/banamind-bm-039-plato-republic
    paths:
      - "src/bm039-republic/**"
      - "scripts/bm039/**"
      - "public/bm039-republic/**"
      - ".github/workflows/bm039-republic.yml"
  workflow_dispatch:

concurrency:
  group: bm039-republic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OUT: banamind_bm039_plato_republic_30min

jobs:
  voice:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci voice]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.save.outputs.sha }}
      ranges: ${{ steps.plan.outputs.ranges }}
      render: ${{ steps.plan.outputs.render }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: ElevenLabs quota (info)
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          curl -sS -H "xi-api-key: $ELEVENLABS_API_KEY" https://api.elevenlabs.io/v1/user/subscription \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print({k: d.get(k) for k in ('tier','character_count','character_limit','next_character_count_reset_unix')} if 'tier' in d else d)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          node -e "import('./scripts/bm039/lib.mjs').then(m=>{const n=m.SCENES.flatMap(s=>s.lines).reduce((a,l)=>a+(l.say??l.text).length,0);console.log('Символов в сценарии:',n)})" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/bm039/voice.mjs

      - name: Save new voice files to the branch
        id: save
        if: always()
        run: |
          [ -d public/bm039-republic/voice ] && git add public/bm039-republic/voice
          if ! git diff --cached --quiet; then
            git diff --cached --stat | tail -3
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(bm039): save voice files [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tests and render plan
        id: plan
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          node --test scripts/bm039/*.test.mjs
          node scripts/bm039/captions-check.mjs > /dev/null
          P=$(node scripts/bm039/frames.mjs 10)
          echo "$P"
          echo "ranges=$(echo "$P" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)["ranges"]))')" >> "$GITHUB_OUTPUT"
          if [[ "$MSG" == *"[no render]"* ]]; then echo "render=false" >> "$GITHUB_OUTPUT"; else echo "render=true" >> "$GITHUB_OUTPUT"; fi

  render:
    needs: voice
    if: needs.voice.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        range: ${{ fromJSON(needs.voice.outputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render frames ${{ matrix.range }} (muted, H.264)
        run: |
          mkdir -p out/parts
          N=$(echo "${{ matrix.range }}" | cut -d- -f1)
          npx remotion render src/bm039-republic/index.ts RepublicFilm "out/parts/part-$(printf %06d "$N").mp4" \
            --frames=${{ matrix.range }} --muted --codec=h264 --pixel-format=yuv420p --color-space=bt709 \
            --crf=17 --x264-preset=medium --concurrency=100% --log=warn
          ls -la out/parts

      - uses: actions/upload-artifact@v4
        with:
          name: bm039-part-${{ strategy.job-index }}
          path: out/parts/*.mp4
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: bm039-part-*
          path: out/parts
          merge-multiple: true

      - name: Concat video, mix audio, mux (AAC 192k, faststart), SRT
        run: |
          mkdir -p out/bm039
          ls out/parts/*.mp4 | sort | sed "s/^/file '/; s/$/'/; s/out\/parts\///" > out/parts/list.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i out/parts/list.txt -c copy out/video.mp4
          node scripts/bm039/mixdown.mjs out/audio.wav
          ffmpeg -hide_banner -loglevel error -y -i out/video.mp4 -i out/audio.wav -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k -ar 48000 -shortest -movflags +faststart out/bm039/final-youtube.mp4
          node scripts/bm039/srt.mjs out/bm039/final-youtube.srt
          node scripts/bm039/chapters.mjs > out/bm039/chapters.txt

      - name: Verify MP4
        run: node scripts/bm039/verify.mjs out/bm039/final-youtube.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preview copy (960×540) and check frames
        run: |
          ffmpeg -hide_banner -loglevel error -y -i out/bm039/final-youtube.mp4 -vf scale=960:540:flags=lanczos -c:v libx264 -preset medium -crf 26 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "out/bm039/preview-960x540.mp4"
          mkdir -p out/frames
          for s in 5 120 300 600 900 1100 1200 1500 1650 1790; do
            ffmpeg -hide_banner -loglevel error -y -ss $s -i out/bm039/final-youtube.mp4 -frames:v 1 -vf scale=960:-2 "out/frames/t$(printf %04d $s).jpg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bm039-final
          path: |
            out/bm039/final-youtube.mp4
            out/bm039/final-youtube.srt
            out/bm039/preview-960x540.mp4
            out/bm039/chapters.txt
            out/frames/*.jpg
          if-no-files-found: error
          retention-days: 30

      - name: Private pre-release bm039-plato-republic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=bm039-plato-republic
          NOTES="BanaMind BM-039 — Платон «Государство» (пер. А. Н. Егунова). Русский, 1920×1080, 30 fps, H.264/AAC. Приватный рабочий релиз, НЕ для публикации до проверки прав. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "${{ needs.voice.outputs.sha }}"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BM-039 Платон «Государство» — BanaMind (30 мин, приватно)" --notes "$NOTES" --prerelease --target "${{ needs.voice.outputs.sha }}"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            out/bm039/final-youtube.mp4 out/bm039/final-youtube.srt out/bm039/preview-960x540.mp4 out/bm039/chapters.txt
          {
            echo "### Файлы"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/final-youtube.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/preview-960x540.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/final-youtube.srt"
          } >> "$GITHUB_STEP_SUMMARY"
