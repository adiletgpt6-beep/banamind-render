name: BalaGoLive04Motion (live video №4)

# Четвёртое живое видео: оригинальная съёмка + motion-графика.
# Собирается только эта композиция (прежние ролики здесь не рендерятся).
#   voice   → бренд-реплика финала (город + оба способа связи) отдельным
#             женским голосом проекта; лучший из 3 дублей по MMS; готовый
#             файл повторно не синтезируется; новый сохраняется в ветку.
#   render  → исходники из GitHub Release balago-live04-sources (GITHUB_TOKEN),
#             очищенный голос, lint/TypeScript, тесты, контрольные кадры,
#             MP4 1080×1920 + облегчённая копия 540×960 (faststart), проверка.
#   publish → оба MP4 и лист кадров — файлами предварительного релиза
#             live04-motion-preview (прямые ссылки на MP4, не ZIP).

# Версия v1 (LIVE-004 v1) готова и опубликована; при push больше не
# пересобирается (live-videos/RULES.md: старые композиции не рендерятся).
# Новые версии живых видео собирает live-videos.yml. Ручной запуск — только
# при осознанной пересборке v1.
on:
  workflow_dispatch:

concurrency:
  group: live04-motion-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-live04-motion

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Brand voice line (cached file is reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LIVE04_STRICT_VOICE: "1"
        run: node scripts/live04/brand-voice.mjs

      - name: Save new voice file to the branch
        if: github.ref_name != 'main'
        run: |
          git add public/audio/live04/brand.mp3 public/audio/live04/brand.json
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save live04 brand voice line"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 5
          done
          exit 1

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Голова ветки: в ней уже сохранённая задачей voice реплика.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Sources from GitHub Release (SHA-256 checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live04/fetch-sources.mjs

      - name: Clean original voice (no TTS, same timing)
        run: node scripts/live04/prepare-voice.mjs

      - name: Tests (transcript, final screen rules, brand voice)
        env:
          LIVE04_STRICT_VOICE: "1"
        run: node --test scripts/live04/live04.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Bundle
        run: npm run bundle

      - name: Render check frames
        run: node scripts/live04/stills.mjs

      - name: Render MP4 (H.264/AAC, yuv420p)
        run: npm run render:live04 -- --log=warn

      - name: Faststart + mobile copy (540×960)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 23 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-preview-540x960.mp4"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/live04/verify.mjs "out/$OUT.mp4"
          node scripts/live04/verify.mjs "out/$OUT-preview-540x960.mp4" --mobile
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
          cp out/frames-live04/contact-sheet.jpg "out/$OUT-frames.jpg"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-live04-motion-mp4
          path: |
            out/balago-live04-motion.mp4
            out/balago-live04-motion-preview-540x960.mp4
            out/balago-live04-motion-frames.jpg
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-live04-motion-frames
          path: out/frames-live04/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-live04-motion-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: live04-motion-preview
        run: |
          ls -la out
          NOTES="BalaGoLive04Motion — «А если встреча затянулась?». Оригинал: 1080×1920, 30 fps, H.264/AAC. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo — живое видео №4 (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "out/$OUT.mp4" "out/$OUT-preview-540x960.mp4" "out/$OUT-frames.jpg"
          {
            echo "### MP4"
            echo "- Оригинал 1080×1920: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- Предпросмотр 540×960: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-preview-540x960.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
