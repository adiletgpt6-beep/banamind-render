name: BalaGo-50 BG-035 (выпуск №35, 2D)

# Выпуск №35 / BG-035 «20 + 2 толук сапар». Собирается ТОЛЬКО композиция
# BalaGoBG035 из собственной точки входа src/campaign50/bg-035/index.ts
# (общие src/Root.tsx, src/index.ts и прежние ролики не участвуют).
# Массовый render.yml эти пути игнорирует (paths-ignore: src/campaign50/**,
# scripts/campaign50/**, public/*/campaign50/**, campaign50-*.yml).
#
# Стадия задаётся файлом scripts/campaign50/bg-035/stage.json:
#   "voice"   → только озвучка (ElevenLabs, готовые кыргызские голоса проекта,
#               3 дубля, лучший по распознаванию MMS); MP3 коммитятся в ветку.
#   "preview" → озвучка из кэша + проверки + кадры + дешёвый MP4 540×960.
#   "final"   → озвучка из кэша + проверки + кадры + оригинал 1080×1920
#               30 fps H.264/AAC faststart + мобильная копия 540×960.
# Сохранённые MP3 повторно не запрашиваются (кэш по хэшу текста и настроек).
# publish → файлы стадии в предварительный релиз campaign50-bg-035-ep35.

on:
  push:
    branches:
      - "claude/balago-episode-35-prep-4dc5ua"
    paths:
      - "src/campaign50/bg-035/**"
      - "scripts/campaign50/bg-035/**"
      - "public/audio/campaign50/bg-035/**"
      - "public/assets/campaign50/bg-035/**"
      - ".github/workflows/campaign50-bg-035.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-035-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-035
  ENTRY: src/campaign50/bg-035/index.ts
  TAG: campaign50-bg-035-ep35

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Stage
        id: stage
        run: |
          STAGE=$(jq -r .stage scripts/campaign50/bg-035/stage.json)
          case "$STAGE" in voice|preview|final) ;; *) echo "::error::неизвестная стадия $STAGE"; exit 1;; esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Стадия BG-035: $STAGE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Check cached voice
        id: cache
        run: |
          if node scripts/campaign50/bg-035/voice.mjs --check; then
            echo "fresh=1" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.fresh != '1'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/campaign50/bg-035/requirements-asr.txt

      - name: Install MMS speech recognition
        if: steps.cache.outputs.fresh != '1'
        run: pip install --quiet -r scripts/campaign50/bg-035/requirements-asr.txt

      - name: Cache MMS model
        if: steps.cache.outputs.fresh != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-035/voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-035/voice ]; then git add public/audio/campaign50/bg-035/voice; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save BG-035 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-035/voice/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-035-voice
          path: public/audio/campaign50/bg-035/voice/
          retention-days: 30

  render:
    needs: voice
    if: needs.voice.outputs.stage == 'preview' || needs.voice.outputs.stage == 'final'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STAGE: ${{ needs.voice.outputs.stage }}
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npx eslint src/campaign50/bg-035 && npx tsc

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Script checks (Kyrgyz text, CTA, timeline, voice)
        env:
          BG35_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-035/check.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames
        env:
          STILL_SCALE: "0.5"
        run: node scripts/campaign50/bg-035/stills.mjs --voice

      - name: Preview MP4 (540×960, H.264/AAC, 30 fps)
        if: env.STAGE == 'preview'
        run: |
          npx remotion render "$ENTRY" BalaGoBG035 "out/$OUT-preview-540x960.mp4" \
            --scale=0.5 --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT-preview-540x960.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT-preview-540x960.mp4"
          node scripts/campaign50/bg-035/verify.mjs "out/$OUT-preview-540x960.mp4" --mobile

      - name: Final MP4 (1080×1920, H.264/AAC, yuv420p, 30 fps) + mobile copy
        if: env.STAGE == 'final'
        run: |
          npx remotion render "$ENTRY" BalaGoBG035 "out/$OUT.mp4" \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile-540x960.mp4"
          node scripts/campaign50/bg-035/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-035/verify.mjs "out/$OUT-mobile-540x960.mp4" --mobile

      - name: List MP4
        run: ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-035-${{ env.STAGE }}-mp4
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-035-${{ env.STAGE }}-frames
          path: out/frames-bg-035/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      STAGE: ${{ needs.voice.outputs.stage }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-035-${{ env.STAGE }}-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          NOTES="BalaGoBG035 (выпуск №35, «20 + 2 толук сапар») — на просмотре у владельца, не принят. Стадия ${STAGE}. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №35 BG-035 «20 + 2 толук сапар» — 2D" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*.mp4
          {
            echo "### MP4 (${STAGE})"
            for f in out/*.mp4; do echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
