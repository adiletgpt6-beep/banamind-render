name: BanaMind — validate 500-book registry (docs only)
on:
  pull_request:
    paths:
      - "books/500-series/**"
      - ".github/workflows/banamind-registry-check.yml"
  push:
    paths:
      - "books/500-series/**"
      - ".github/workflows/banamind-registry-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node books/500-series/validate-registry.mjs
