name: Probe 3D service secrets
on:
  push:
    branches: [feature/half-hour-v4]
    paths: [.github/workflows/secret-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report which keys are configured (names only, never values)
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          MESHY_KEY: ${{ secrets.MESHY_KEY }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
          TRIPO_KEY: ${{ secrets.TRIPO_KEY }}
          RODIN_API_KEY: ${{ secrets.RODIN_API_KEY }}
          HYPER3D_API_KEY: ${{ secrets.HYPER3D_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for n in MESHY_API_KEY MESHY_KEY TRIPO_API_KEY TRIPO_KEY RODIN_API_KEY HYPER3D_API_KEY FAL_KEY REPLICATE_API_TOKEN OPENAI_API_KEY ELEVENLABS_API_KEY; do
            if [ -n "${!n}" ]; then echo "$n: set"; else echo "$n: not set"; fi
          done
