name: Lesson 80-1-7 «Почему приходит утро?»

# Мини-фильм 80-1-7 (композиция Lesson80_1_7, 1920×1080, 30 к/с, ≈ 4:30).
#   voice   → голосовая лаборатория (образцы кандидатов) и озвучка 44 реплик
#             ElevenLabs голосами из src/lesson-80-1-7/script.ts; новые файлы
#             сохраняются в ветку, готовые реплики повторно не синтезируются.
#   render  → lint/TypeScript, проверки, контрольные кадры, MP4 1920×1080
#             (faststart), SRT; задача падает, если MP4 не создан или
#             формат/длительность/звук не те.
#   publish → MP4 и SRT как файлы предварительного релиза lesson-80-1-7-preview.

on:
  push:
    paths:
      - "src/lesson80/film-1-7/**"
      - "src/Lesson80_1_7.tsx"
      - "scripts/lesson80-1-7*"
      - "scripts/lib/l80-*"
      - "public/lesson-80-1-7/**"
      - ".github/workflows/lesson-80-1-7.yml"
  workflow_dispatch:
    inputs:
      lab:
        description: "Голосовая лаборатория: образцы кандидатов голосов"
        type: boolean
        default: false
      render:
        description: "Собрать MP4"
        type: boolean
        default: true

concurrency:
  group: lesson-80-1-7-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: lesson-80-1-7

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Install RHVoice (offline fallback)
        run: sudo apt-get install -y --no-install-recommends rhvoice rhvoice-russian librhvoice5 || true

      # Образцы кандидатов голосов ElevenLabs: при первом прогоне и по запросу.
      - name: Voice lab (candidate samples)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.lab) || hashFiles('voice-samples/lesson-80-1-7/report.json') == '' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::warning::ELEVENLABS_API_KEY не задан — лаборатория пропущена"; exit 0; fi
          node scripts/lesson80-1-7-voice.mjs --lab 2>&1 | tee lab.log

      # Реплики: готовые (тот же хэш) переиспользуются без обращения к API.
      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/lesson80-1-7-voice.mjs

      - name: Room tone and prop sounds
        run: node scripts/lesson80-1-7-sfx.mjs

      - name: Save new voice files to the branch
        id: save
        if: always() && github.ref_name != 'main'
        run: |
          # неполный манифест (прерванный синтез) в ветку не сохраняется
          if [ -f public/lesson-80-1-7/audio/manifest.json ] && node -e 'const m=require("./public/lesson-80-1-7/audio/manifest.json"); process.exit(m.partial || m.lines.some((l)=>!l) ? 1 : 0)'; then :; else echo "::warning::Озвучка неполная — файлы не сохраняются"; git checkout -- public/lesson-80-1-7/audio/manifest.json 2>/dev/null || true; fi
          git add -A public/lesson-80-1-7 voice-samples/lesson-80-1-7 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save lesson-80-1-7 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "saved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Voice lab summary
        if: always() && hashFiles('voice-samples/lesson-80-1-7/report.json') != ''
        run: |
          { echo '### Голосовая лаборатория'; echo '```'; tail -20 lab.log 2>/dev/null || cat voice-samples/lesson-80-1-7/report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload voice files
        if: always() && hashFiles('public/lesson-80-1-7/audio/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lesson-80-1-7-voice
          path: |
            public/lesson-80-1-7/audio/
            voice-samples/lesson-80-1-7/
          retention-days: 30

  render:
    needs: voice
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.render }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (globe model, timeline, pauses, voice files)
        run: node --test scripts/lesson80-1-7.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Bundle
        run: npm run bundle

      - name: Render check frames
        run: npm run stills:lesson-80-1-7

      - name: Render MP4 (H.264/AAC, yuv420p, 1920×1080)
        run: npm run render:lesson-80-1-7 -- --log=warn

      - name: Faststart, SRT and verification
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          node scripts/lesson80-1-7-srt.mjs "out/$OUT.srt"
          node scripts/lesson80-1-7-verify.mjs "out/$OUT.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4 and SRT
        uses: actions/upload-artifact@v4
        with:
          name: lesson-80-1-7-mp4
          path: |
            out/lesson-80-1-7.mp4
            out/lesson-80-1-7.srt
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-80-1-7-frames
          path: out/frames-lesson-80-1-7/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [voice, render]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.render }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lesson-80-1-7-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: lesson-80-1-7-preview
        run: |
          ls -la out
          NOTES="Урок 80-1, мини-фильм 7 «Почему приходит утро?» — предварительный просмотр. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Урок 80-1-7 «Почему приходит утро?» (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$OUT.mp4" "out/$OUT.srt"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.srt"
          } >> "$GITHUB_STEP_SUMMARY"
