name: BalaGoBG023 (BalaGo-50 №24)

# Выпуск №24 / BG-023 «Эмне үчүн 3–4 бала?». Собирается ТОЛЬКО эта композиция
# (src/campaign50/bg-023/index.ts); прежние ролики и соседние выпуски здесь
# не рендерятся. Общий render.yml эти пути игнорирует (paths-ignore).
#   voice   → реплики диктора ElevenLabs; готовые (тот же хэш) не синтезируются,
#             новые сохраняются в ветку.
#   render  → lint/TypeScript, тесты, контрольные кадры, MP4 1080×1920 и
#             облегчённая копия 540×960 (faststart без пережатия оригинала).
#   publish → оба MP4 файлами предварительного релиза bg-023-ep24.

on:
  push:
    paths:
      - "src/campaign50/bg-023/**"
      - "scripts/campaign50/bg-023/**"
      - "public/audio/campaign50/bg-023/**"
      - ".github/workflows/campaign50-bg-023.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-023-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-023-ep24
  ENTRY: src/campaign50/bg-023/index.ts

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Check whether new lines need synthesis
        id: need
        run: |
          if ELEVENLABS_API_KEY= node scripts/campaign50/bg-023/generate-voice.mjs >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          git checkout -- public/audio/campaign50/bg-023 2>/dev/null || true

      - uses: actions/setup-python@v5
        if: steps.need.outputs.new == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition
        if: steps.need.outputs.new == 'true'
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        if: steps.need.outputs.new == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-023/generate-voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          git add public/audio/campaign50/bg-023 || true
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(bg-023): save narration files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (texts, CTA, timeline, voice files)
        env:
          BG23_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-023/bg023.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames
        run: node scripts/campaign50/bg-023/stills.mjs

      - name: Render MP4 (H.264/AAC, yuv420p)
        run: npx remotion render "$ENTRY" BalaGoBG023 "out/$OUT.mp4" --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac --log=warn

      - name: Faststart + mobile preview (540×960)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-preview-540x960.mp4"

      - name: Verify MP4 files
        run: |
          node scripts/campaign50/bg-023/verify.mjs "out/$OUT.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/campaign50/bg-023/verify.mjs "out/$OUT-preview-540x960.mp4" --mobile | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4s
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-023-mp4
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-023-frames
          path: out/frames-bg-023/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-023-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bg-023-ep24
        run: |
          ls -la out
          NOTES="BalaGo-50 №24 / BG-023 «Эмне үчүн 3–4 бала?» — на просмотр владельцу (ещё не принят). Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №24 — BG-023 (на просмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$OUT.mp4" "out/$OUT-preview-540x960.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-preview-540x960.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
