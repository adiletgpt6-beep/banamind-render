# Muslim Kids 005 «Когда краски оживают» — только озвучка (ElevenLabs, ~700 символов).
# Рендер выполняется локально; workflow лишь синтезирует голос и коммитит WAV в ветку.
name: muslimkids-voice
on:
  push:
    paths:
      - "muslimkids-invisible-painter/scripts/lines.mjs"
      - "muslimkids-invisible-painter/scripts/voice.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Синтез голоса
        working-directory: muslimkids-invisible-painter
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/voice.mjs
      - name: Коммит аудио в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add muslimkids-invisible-painter/public/audio
          git commit -m "muslimkids-005: озвучка (ElevenLabs) [skip ci]" || exit 0
          git push
