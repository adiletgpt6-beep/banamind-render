name: BanaMind BM-002 — Ибн Хишам (фильм 30 мин, 16:9)

# BanaMind BM-002: «Жизнеописание Пророка Мухаммада» (Ибн Хишам) простыми словами,
# ведущий — банан. Не реклама BalaGo: правила BalaGo о контактах, Бишкеке и кыргызской
# озвучке к нему не применяются. Своя точка входа Remotion, прежние ролики не трогает.
#   voice    → озвучка ElevenLabs по репликам (готовые с тем же хэшем переиспользуются),
#              новые файлы сохраняются в ветку. Запускается на каждый пуш файлов фильма.
#   render   → только по «[render-bm002]» в сообщении коммита или вручную (workflow_dispatch):
#              8 параллельных частей кадров (без звука), 1920×1080 30 fps.
#   assemble → склейка без пережатия, звук по тайм-лайну, AAC + faststart, SRT, проверка
#              формата/длительности/звука, облегчённая копия 960×540, пилот 60 с, кадры;
#              приватный пре-релиз book-ibn-khisham-film (репозиторий приватный,
#              публичной публикации нет — права на перевод не подтверждены).

on:
  push:
    paths:
      - "src/books/ibn-khisham-zhizneopisanie-proroka/**"
      - "scripts/books/ibn-khisham/**"
      - "public/ibn-khisham/**"
      - ".github/workflows/book-ibn-khisham.yml"
  workflow_dispatch:
    inputs:
      render:
        description: "Полный рендер фильма"
        type: boolean
        default: true

concurrency:
  group: book-ibn-khisham-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: final-youtube
  TAG: book-ibn-khisham-film

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.save.outputs.sha }}
      ranges: ${{ steps.plan.outputs.ranges }}
      render: ${{ steps.plan.outputs.render }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: ElevenLabs quota (info)
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          curl -sS -H "xi-api-key: $ELEVENLABS_API_KEY" https://api.elevenlabs.io/v1/user/subscription \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print({k: d.get(k) for k in ('tier','character_count','character_limit','next_character_count_reset_unix')} if 'tier' in d else d)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/books/ibn-khisham/voice.mjs | tail -n 5 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save new voice files to the branch
        id: save
        if: always() && github.ref_name != 'main'
        run: |
          [ -d public/ibn-khisham/voice ] && git add public/ibn-khisham/voice
          if ! git diff --cached --quiet; then
            git diff --cached --stat | tail -3
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(BM-002): save voice files [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Timeline, captions check, render plan
        id: plan
        env:
          MSG: ${{ github.event.head_commit.message }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.render }}
        run: |
          node --test scripts/books/ibn-khisham/*.test.mjs
          node scripts/books/ibn-khisham/captions-check.mjs | tail -n 20
          node -e 'import("./scripts/books/ibn-khisham/lib.mjs").then(m=>{const t=m.timeline();console.log(`длительность ${(t.duration/60).toFixed(2)} мин, естественная ${(t.natural/60).toFixed(2)} мин`)})' | tee -a "$GITHUB_STEP_SUMMARY"
          P=$(node scripts/books/ibn-khisham/frames.mjs 8)
          echo "$P"
          echo "ranges=$(echo "$P" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)["ranges"]))')" >> "$GITHUB_OUTPUT"
          if [[ "$MSG" == *"[render-bm002]"* || "$DISPATCH" == "true" ]]; then echo "render=true" >> "$GITHUB_OUTPUT"; else echo "render=false" >> "$GITHUB_OUTPUT"; fi

  render:
    needs: voice
    if: needs.voice.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: true
      matrix:
        range: ${{ fromJSON(needs.voice.outputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render frames ${{ matrix.range }} (muted, H.264)
        run: |
          mkdir -p out/parts
          N=$(echo "${{ matrix.range }}" | cut -d- -f1)
          npx remotion render src/books/ibn-khisham-zhizneopisanie-proroka/index.ts IbnKhishamFilm "out/parts/part-$(printf %06d "$N").mp4" \
            --frames=${{ matrix.range }} --muted --codec=h264 --pixel-format=yuv420p --color-space=bt709 \
            --crf=18 --x264-preset=medium --concurrency=100% --log=warn
          ls -la out/parts

      - uses: actions/upload-artifact@v4
        with:
          name: bm002-part-${{ strategy.job-index }}
          path: out/parts/*.mp4
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: bm002-part-*
          path: out/parts
          merge-multiple: true

      - name: Concat video, mix audio, mux (AAC 192k, faststart), SRT
        run: |
          ls out/parts/*.mp4 | sort | sed "s/^/file '/; s/$/'/; s/out\/parts\///" > out/parts/list.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i out/parts/list.txt -c copy out/video.mp4
          node scripts/books/ibn-khisham/mixdown.mjs out/audio.wav
          ffmpeg -hide_banner -loglevel error -y -i out/video.mp4 -i out/audio.wav -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k -ar 48000 -shortest -movflags +faststart "out/$OUT.mp4"
          node scripts/books/ibn-khisham/srt.mjs "out/$OUT.srt"
          node scripts/books/ibn-khisham/chapters.mjs > out/chapters.txt
          cat out/chapters.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify MP4
        run: node scripts/books/ibn-khisham/verify.mjs "out/$OUT.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preview copy (960×540), pilot 60 s, check frames
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -vf scale=960:540:flags=lanczos -c:v libx264 -preset medium -crf 26 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "out/$OUT-preview-960x540.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -t 60 -c:v libx264 -preset medium -crf 18 \
            -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart "out/$OUT-first-60s.mp4"
          mkdir -p out/frames
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$OUT.mp4" | cut -d. -f1)
          for s in $(seq 5 60 $D); do
            ffmpeg -hide_banner -loglevel error -y -ss $s -i "out/$OUT.mp4" -frames:v 1 -vf scale=640:-2 "out/frames/t$(printf %04d $s).jpg"
          done
          ffmpeg -hide_banner -loglevel error -y -pattern_type glob -i 'out/frames/*.jpg' -vf "tile=6x6:padding=6:color=white" -frames:v 1 out/contact-sheet.jpg || true

      - uses: actions/upload-artifact@v4
        with:
          name: bm002-final
          path: |
            out/${{ env.OUT }}.mp4
            out/${{ env.OUT }}-preview-960x540.mp4
            out/${{ env.OUT }}-first-60s.mp4
            out/${{ env.OUT }}.srt
            out/contact-sheet.jpg
            out/chapters.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish private pre-release (repository is private)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="BanaMind BM-002 — «Жизнеописание Пророка Мухаммада» (Ибн Хишам) простыми словами. 1920×1080, 30 fps, H.264/AAC. ВНУТРЕННЯЯ ВЕРСИЯ ДЛЯ ПРОВЕРКИ: права на использование русского перевода (Н. А. Гайнуллин, «Умма», 2007) не подтверждены — не публиковать на YouTube до решения владельца. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "${{ needs.voice.outputs.sha }}"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BanaMind BM-002 — Ибн Хишам, фильм 30 мин (внутренняя версия)" --notes "$NOTES" --prerelease --target "${{ needs.voice.outputs.sha }}"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "out/$OUT.mp4" "out/$OUT-preview-960x540.mp4" "out/$OUT-first-60s.mp4" "out/$OUT.srt" out/contact-sheet.jpg out/chapters.txt
          {
            echo "### Файлы"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-preview-960x540.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.srt"
          } >> "$GITHUB_STEP_SUMMARY"
