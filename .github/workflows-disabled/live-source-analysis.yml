name: BalaGo LIVE — private source analysis pack (draft)

# Для облачной среды Claude Code, где хранилище Actions Artifacts
# (*.blob.core.windows.net) и Cloudflare R2 закрыты сетевой политикой,
# а файлы GitHub Release доступны.
#
# Берёт исходник LIVE-NNN из приватного R2 (ключ — только из доверенной
# карточки Issue), делает облегчённую копию для просмотра 720×1280 со звуком
# и черновую расшифровку кыргызской речи (Meta MMS, адаптер kir) с таймкодами.
# Всё кладётся в ЧЕРНОВИК Release `<live-id>-analysis-private`: черновик виден
# только участникам с правом записи, тег не создаётся. Оригинал MP4 не
# публикуется и не коммитится. После скачивания черновик удаляется:
#   gh release delete live-005-analysis-private --yes
# НЕ запускает Remotion и рендер.
#
# Старт:
#  - push изменённого live-videos/tasks/LIVE-NNN/source-analysis.json
#    ({"issue": 76, "run": 1} — увеличьте run для повтора), ИЛИ
#  - Actions → Run workflow → номер карточки.
# Если рядом лежит asr-checks.json, дополнительно сверяются варианты текста
# неуверенных мест (scripts/live04/asr_check.py).
# Только сверка без черновика: "mode": "checks" — результат в логе и сводке.
# Удаление черновика после скачивания (если сессии запрещено удалять Release):
# "delete": true в source-analysis.json или mode=delete при ручном запуске —
# тогда workflow только удаляет черновики анализа и ничего не скачивает.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Номер карточки LIVE-NNN (например 76 для LIVE-005)"
        required: true
        type: string
      mode:
        description: "analyze — собрать черновик; checks — только сверка вариантов текста в лог; delete — удалить черновики анализа"
        required: false
        type: choice
        options: [analyze, checks, delete]
        default: analyze
  push:
    paths:
      - "live-videos/tasks/*/source-analysis.json"

permissions:
  contents: write
  issues: read

concurrency:
  group: live-source-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/balago-studio/package-lock.json

      - name: Номер карточки
        id: request
        env:
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_MODE: ${{ inputs.mode }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_ISSUE:-}" ]; then
            echo "issue=$INPUT_ISSUE" >> "$GITHUB_OUTPUT"
            echo "mode=${INPUT_MODE:-analyze}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          REQ=$(git diff --name-only "$BASE" HEAD -- live-videos/tasks | grep -E '^live-videos/tasks/LIVE-[0-9]{3}/source-analysis\.json$' | head -n1 || true)
          if [ -z "$REQ" ]; then echo "::error::Нет изменённого source-analysis.json"; exit 1; fi
          ISSUE=$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(!Number.isSafeInteger(j.issue))process.exit(1);console.log(j.issue)' "$REQ")
          MODE=$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(j.delete===true?"delete":j.mode==="checks"?"checks":"analyze")' "$REQ")
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$REQ")" >> "$GITHUB_OUTPUT"

      - name: Прочитать и проверить карточку LIVE в GitHub
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const n = Number(process.env.ISSUE_NUMBER);
          if (!Number.isSafeInteger(n) || n < 1) throw new Error("Неверный номер карточки");
          const u = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${n}`;
          const res = await fetch(u, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });
          if (!res.ok) throw new Error(`GitHub Issue #${n}: HTTP ${res.status}`);
          const issue = await res.json();
          if (issue.pull_request) throw new Error("Нужна карточка Issue, не PR");
          const title = /^LIVE-(\d{3})(?:\s|$)/.exec(issue.title ?? "");
          const source = /Ключ объекта:\s*`(live\/raw\/[0-9a-f-]{36}\/source\.(mp4|mov))`/.exec(issue.body ?? "");
          if (!title || !source) throw new Error("В Issue не найден валидный LIVE-NNN и приватный исходник R2");
          const id = `LIVE-${title[1]}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `live_id=${id}\nlive_slug=${id.toLowerCase()}\nobject_key=${source[1]}\nfile_name=source.${source[2]}\n`);
          console.log(`Проверено: ${id}; ключ приватного источника взят из Issue #${n}.`);
          NODE

      - name: Удалить черновики анализа (после скачивания)
        if: steps.request.outputs.mode == 'delete'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.locate.outputs.live_slug }}-analysis-private
        run: |
          set -euo pipefail
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          for id in $IDS; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; echo "Удалён черновик $TAG ($id)"; done
          echo "- Черновики \`$TAG\` удалены: ${IDS:-нет}" >> "$GITHUB_STEP_SUMMARY"

      - name: Скачать приватный исходник во временную папку runner
        if: steps.request.outputs.mode != 'delete'
        working-directory: apps/balago-studio
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SOURCE_KEY: ${{ steps.locate.outputs.object_key }}
          SOURCE_FILE: ${{ steps.locate.outputs.file_name }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/fetch-source.mjs "$SOURCE_KEY" "$RUNNER_TEMP/live-source/$SOURCE_FILE"
          test -s "$RUNNER_TEMP/live-source/$SOURCE_FILE"

      - name: Install FFmpeg
        if: steps.request.outputs.mode != 'delete'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Паспорт файла, склейки, громкость, копия 720p для просмотра
        if: steps.request.outputs.mode == 'analyze'
        env:
          SRC_FILE: ${{ steps.locate.outputs.file_name }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/live-source/$SRC_FILE"
          PACK="$RUNNER_TEMP/pack"
          mkdir -p "$PACK"
          sha256sum "$SRC" | cut -d' ' -f1 > "$PACK/source-sha256.txt"
          ffprobe -v error -show_format -show_streams -of json "$SRC" > "$PACK/info.json"
          # Склейки внутри исходника (если автор монтировал в телефоне).
          ffmpeg -hide_banner -nostats -i "$SRC" -an -vf "select='gt(scene,0.28)',showinfo" -f null - 2>&1 \
            | grep -oE 'pts_time:[0-9.]+' | cut -d: -f2 > "$PACK/scenes.txt" || true
          # Громкость и паузы оригинальной речи.
          ffmpeg -hide_banner -nostats -i "$SRC" -vn -af ebur128=peak=true -f null - 2>&1 | tail -n 14 > "$PACK/loudness.txt" || true
          ffmpeg -hide_banner -nostats -i "$SRC" -vn -af silencedetect=n=-35dB:d=0.25 -f null - 2>&1 \
            | grep -E 'silence_(start|end)' > "$PACK/silences.txt" || true
          # Облегчённая копия для просмотра (не оригинал): длинная сторона 1280.
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" \
            -vf "scale='if(gt(ih,iw),720,1280)':-2:flags=lanczos" -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart "$PACK/analysis-proxy.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vn -ac 1 -ar 16000 "$RUNNER_TEMP/raw.wav"
          {
            echo "### Паспорт исходника"
            echo '```'
            ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels:stream_tags=rotate -of default=nw=1 "$SRC"
            echo "склейки (scene>0.28): $(tr '\n' ' ' < "$PACK/scenes.txt")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.request.outputs.mode != 'delete'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt
      - name: Install MMS speech recognition
        if: steps.request.outputs.mode != 'delete'
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt
      - name: Cache MMS model
        if: steps.request.outputs.mode != 'delete'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1
      - name: Черновая расшифровка (MMS kir) и сверка вариантов
        if: steps.request.outputs.mode != 'delete'
        env:
          TASK_DIR: live-videos/tasks/${{ steps.locate.outputs.live_id }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -euo pipefail
          PACK="$RUNNER_TEMP/pack"
          mkdir -p "$PACK"
          if [ ! -f "$RUNNER_TEMP/raw.wav" ]; then
            ffmpeg -loglevel error -y -i "$RUNNER_TEMP"/live-source/source.* -vn -ac 1 -ar 16000 "$RUNNER_TEMP/raw.wav"
          fi
          if [ "$MODE" = "checks" ]; then
            test -f "$TASK_DIR/asr-checks.json" || { echo "::error::Нет $TASK_DIR/asr-checks.json"; exit 1; }
            python scripts/live04/asr_check.py "$RUNNER_TEMP/raw.wav" "$TASK_DIR/asr-checks.json" | tee "$PACK/asr-checks.txt"
            { echo '### Сверка вариантов текста (меньше — вероятнее)'; echo '```'; cat "$PACK/asr-checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ffmpeg -loglevel error -y -i "$RUNNER_TEMP/raw.wav" -af "highpass=f=90,loudnorm=I=-18:TP=-2" "$RUNNER_TEMP/clean.wav"
          python scripts/live04/asr.py "$RUNNER_TEMP/raw.wav" "$PACK/asr-raw.json" > "$PACK/asr-raw.txt"
          python scripts/live04/asr.py "$RUNNER_TEMP/clean.wav" "$PACK/asr-clean.json" > "$PACK/asr-clean.txt"
          if [ -n "${TASK_DIR:-}" ] && [ -f "$TASK_DIR/asr-checks.json" ]; then
            python scripts/live04/asr_check.py "$RUNNER_TEMP/raw.wav" "$TASK_DIR/asr-checks.json" > "$PACK/asr-checks.txt"
          fi
          { echo '### Черновая расшифровка (MMS, без пунктуации)'; echo '```'; head -n 1 "$PACK/asr-raw.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Черновик Release (только для участников с правом записи)
        if: steps.request.outputs.mode == 'analyze'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.locate.outputs.live_slug }}-analysis-private
          LIVE: ${{ steps.locate.outputs.live_id }}
        run: |
          set -euo pipefail
          # Прежние черновики анализа этого задания — удалить (повторный запуск).
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          NOTES="$LIVE: ЧЕРНОВИК для анализа монтажа (копия 720p, расшифровка). Не публиковать. Удалить после скачивания: gh release delete $TAG --yes. Прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$LIVE — analysis (private draft)" --notes "$NOTES" "$RUNNER_TEMP"/pack/*
          echo "- Черновик \`$TAG\`: $(ls "$RUNNER_TEMP"/pack | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
