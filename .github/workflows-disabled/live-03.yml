name: BalaGoLive03 (живой ролик №3)

# Третий живой Reels Адилета: оригинальная съёмка + объясняющая анимация.
# Собирается только эта композиция (прежние ролики здесь не рендерятся).
#   1. Исходники скачиваются из GitHub Release balago-live-03-assets
#      (имена, SHA-256 и параметры — src/live-03/assets.json). Для приватного
#      репозитория используется штатный GITHUB_TOKEN с правом contents: read.
#   2. live03:prepare — проверка MP4, рабочая копия 30 fps CFR, обработка голоса.
#   3. lint/TypeScript → рендер → мастеринг (−15 LUFS, ≤ −1.5 dBTP, faststart)
#      → контрольные кадры. Задача падает, если формат или громкость не те.
#   4. Artifacts: balago-live-03-final (MP4) и balago-live-03-frames (PNG).

on:
  push:
    paths:
      - "src/live-03/**"
      - "src/BalaGoLive03.tsx"
      - "scripts/live03-*"
      - ".github/workflows/live-03.yml"
  workflow_dispatch:

concurrency:
  group: live-03-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Download and prepare sources (release balago-live-03-assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run live03:prepare

      - name: Bundle
        run: npm run bundle

      - name: Render + master
        run: |
          npx remotion render build BalaGoLive03 out/balago-live-03-raw.mp4 \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 \
            --audio-codec=aac --audio-bitrate=320k --crf=16
          node scripts/live03-master.mjs

      - name: Control frames
        run: node scripts/live03-stills.mjs

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-live-03-final
          path: out/balago-live-03-final.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-live-03-frames
          path: out/frames-live-03/*.png
          if-no-files-found: warn
          retention-days: 30
