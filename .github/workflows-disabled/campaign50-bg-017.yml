name: BalaGo-50 BG-017 (выпуск №18, 2D)

# Только ролик BG-017 «Рисунок нашей недели» (композиция BalaGoBG017,
# точка входа src/campaign50/bg-017/index.ts). Прежние ролики и другие
# эпизоды кампании здесь не рендерятся; общий render.yml игнорирует пути
# campaign50 (paths-ignore), поэтому массовый рендер не запускается.
#   voice   → реплики ElevenLabs готовыми кыргызскими голосами проекта
#             (3 дубля новой реплики, лучший по распознаванию MMS);
#             сохранённые MP3 переиспользуются, новые коммитятся в ветку.
#   render  → lint/TypeScript, проверка текста, контрольные кадры, MP4
#             1080×1920 и мобильная копия 540×960 (обе с faststart).
#   publish → оба MP4 файлами предварительного релиза campaign50-bg-017-preview.

on:
  push:
    # Только ветки этого эпизода — пуши других чатов сюда не попадают.
    branches:
      - "claude/balago-video-18-*"
      - "feature/bg-017-episode-18"
    paths:
      - "src/campaign50/bg-017/**"
      - "scripts/campaign50/bg-017/**"
      - "public/audio/campaign50/bg-017/**"
      - ".github/workflows/campaign50-bg-017.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-017-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-017
  ENTRY: src/campaign50/bg-017/index.ts
  COMP: BalaGoBG017

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Script check (Бишкек, оба контакта, «сиз»)
        run: node scripts/campaign50/bg-017/check-script.mjs

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/campaign50/bg-017/requirements-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/campaign50/bg-017/requirements-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-017/generate-voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-017 ]; then git add public/audio/campaign50/bg-017; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save BG-017 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-017/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-017-voice
          path: public/audio/campaign50/bg-017/
          retention-days: 30

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript (BG-017)
        run: |
          npx eslint src/campaign50/bg-017
          npx tsc

      - name: Script check
        run: node scripts/campaign50/bg-017/check-script.mjs

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Bundle (only BG-017)
        run: npx remotion bundle "$ENTRY" --out-dir=build-bg-017

      - name: Render check frames
        run: node scripts/campaign50/bg-017/render-stills.mjs build-bg-017

      - name: Render MP4 (H.264/AAC, yuv420p)
        run: npx remotion render build-bg-017 "$COMP" "out/$OUT.mp4" --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac --log=warn

      - name: Faststart + mobile copy (540×960)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile.mp4"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/campaign50/bg-017/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-017/verify.mjs "out/$OUT-mobile.mp4" --mobile
          sha256sum out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-017-mp4
          path: |
            out/balago-bg-017.mp4
            out/balago-bg-017-mobile.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-017-frames
          path: out/frames-bg-017/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-017-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: campaign50-bg-017-preview
        run: |
          ls -la out
          NOTES="BalaGo №18 / BG-017 «Рисунок нашей недели» — предварительный просмотр (ещё не принят владельцем). Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №18 BG-017 (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$OUT.mp4" "out/$OUT-mobile.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-mobile.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
