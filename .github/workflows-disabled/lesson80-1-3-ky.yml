name: Lesson80-1-3-WhatIfICantSee-ky (lesson-80, 80-1-3, кыргызская версия)

# «1-сабак. Аллах — биздин Жаратуучубуз. 3-мини-фильм» — кыргызская версия
# ролика 80-1-3 (те же сцены и действия, своя озвучка и надписи).
#   voice → озвучка 42 реплик ElevenLabs (eleven_v3, ky; готовые дубли не
#           синтезируются), распознавание дублей и файлов реплик моделью
#           Meta MMS (адаптер kir, кэш по хэшу файла); новые файлы — в ветку.
# Видео рендерится локально:
#   npm run render:80-1-3-ky → out/lesson-80-1-3-what-if-i-cant-see-ky-16x9.mp4

on:
  push:
    paths:
      - "src/lesson80-1-3/script-ky.ts"
      - "src/lesson80-1-3/script.ts"
      - "src/lesson80-1-3/edition.ts"
      - "src/lesson80-1-3/voices-ky.json"
      - "scripts/lesson80-1-3-voice.mjs"
      - "scripts/lesson80-1-3-ky-asr.py"
      - "public/audio/lesson80-1-3-ky/*.mp3"
      - ".github/workflows/lesson80-1-3-ky.yml"
  workflow_dispatch:

concurrency:
  group: lesson80-1-3-ky-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Voiceover (cached takes are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/lesson80-1-3-voice.mjs --lang=ky

      - name: Install FFmpeg
        if: always()
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition
        if: always()
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Speech recognition of takes and line files (MMS, cached)
        if: always()
        run: python3 scripts/lesson80-1-3-ky-asr.py

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/lesson80-1-3-ky ]; then git add public/audio/lesson80-1-3-ky; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat | tail -3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save lesson 80-1-3 (ky) voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
