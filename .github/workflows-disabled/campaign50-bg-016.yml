name: BalaGo-50 №17 — BG-016 (2D)

# Выпуск №17 «Мама сегодня не спешит» — собирается ТОЛЬКО композиция
# BalaGoBG016 (src/campaign50/bg-016/index.ts). Прежние ролики и другие
# выпуски партии здесь не рендерятся; общий render.yml игнорирует эти пути
# (paths-ignore: src/campaign50/**, public/audio/campaign50/**,
# scripts/campaign50/**, .github/workflows/campaign50-*.yml).
#   voice   → реплики ElevenLabs готовыми кыргызскими голосами проекта;
#             кэш по хэшу текста/голоса/настроек — готовые не синтезируются;
#             новые файлы сохраняются в ветку.
#   render  → lint/TypeScript, тесты, контрольные кадры, MP4 1080×1920 30 fps
#             H.264/AAC + облегчённая копия 540×960 (обе с faststart),
#             проверка файлов по ffprobe.
#   publish → оба MP4 файлами предварительного релиза bg-016-ep17-preview
#             (прямые ссылки на .mp4, не ZIP).

on:
  push:
    branches:
      - "claude/balago-video-17-bonuhn"
      - "feature/bg-016-*"
    paths:
      - "src/campaign50/bg-016/**"
      - "scripts/campaign50/bg-016/**"
      - "public/audio/campaign50/bg-016/**"
      - "public/assets/campaign50/bg-016/**"
      - ".github/workflows/campaign50-bg-016.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-016-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-016-ep17
  VOICE_DIR: public/audio/campaign50/bg-016

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-016/voice.mjs

      - name: Save new voice files to the branch
        if: github.ref_name != 'main'
        run: |
          git add "$VOICE_DIR"
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(bg-016): save voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-016/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-016-voice
          path: public/audio/campaign50/bg-016/
          retention-days: 30

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Голова ветки — уже с сохранёнными задачей voice файлами.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (texts, CTA, timeline, voice files)
        env:
          BG016_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-016/bg016.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames
        run: node scripts/campaign50/bg-016/stills.mjs --scale=0.5

      - name: Render MP4 (H.264/AAC, yuv420p)
        run: |
          npx remotion render build/bg-016 BalaGoBG016 "out/$OUT.mp4" \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --crf=18 --audio-bitrate=192k --log=warn

      - name: Faststart + mobile copy (540×960)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-preview-540x960.mp4"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/campaign50/bg-016/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-016/verify.mjs "out/$OUT-preview-540x960.mp4" --mobile
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-016-mp4
          path: |
            out/balago-bg-016-ep17.mp4
            out/balago-bg-016-ep17-preview-540x960.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-016-frames
          path: out/frames-bg-016/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-016-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bg-016-ep17-preview
          SHA: ${{ needs.render.outputs.sha }}
        run: |
          ls -la out
          NOTES="BalaGo-50 №17 (BG-016) «Мама сегодня не спешит» — предварительный просмотр. Ветка ${GITHUB_REF_NAME}, коммит ${SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Оригинал 1080×1920 30 fps H.264/AAC; предпросмотр 540×960."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №17 — BG-016 (предпросмотр)" --notes "$NOTES" --prerelease --target "$SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "out/$OUT.mp4" "out/$OUT-preview-540x960.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-preview-540x960.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
