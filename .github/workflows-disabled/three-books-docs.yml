name: Three-books documentation checks
on:
  pull_request:
    paths:
      - "three-books/**"
      - ".github/workflows/three-books-docs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate registry, rule batches and state gates
        run: node three-books/tools/validate.mjs
      - name: Check gallery utility syntax
        run: node --check three-books/tools/build-gallery.mjs
