name: BalaGo-50 BG-032 (7, 12 или 20 километров?)

# Пилот 2 кампании BalaGo-50. Собирается ТОЛЬКО композиция BalaGoBG032
# (отдельная точка входа src/campaign50/bg-032/index.ts) — прежние ролики здесь
# не рендерятся, а общий render.yml пропускает пути кампании (paths-ignore).
#   voice   → реплики ElevenLabs готовыми кыргызскими голосами проекта
#             (3 дубля новой реплики, лучший по распознаванию MMS); готовые
#             (тот же хэш текста/голоса/настроек) повторно не синтезируются;
#             новые файлы сохраняются в ветку.
#   render  → lint/TypeScript, тесты правил, контрольные кадры, MP4
#             1080×1920 30 fps H.264/AAC и предпросмотр 540×960 (faststart).
#             Задача падает, если MP4 не создан или формат/длительность/звук
#             не те.
#   publish → оба MP4 файлами предварительного релиза bg-032-preview
#             (прямые ссылки на MP4).

on:
  push:
    paths:
      - "src/campaign50/bg-032/**"
      - "scripts/campaign50/bg-032/**"
      - "public/audio/campaign50/bg-032/**"
      - "public/assets/campaign50/bg-032/**"
      - ".github/workflows/campaign50-bg-032.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-032-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-032

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-032/voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-032 ]; then git add public/audio/campaign50/bg-032; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save BG-032 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-032/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-032-voice
          path: public/audio/campaign50/bg-032/
          retention-days: 30

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (rules, final screen, voice timing)
        env:
          BG32_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-032/bg-032.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Bundle (campaign entry point only)
        run: npx remotion bundle src/campaign50/bg-032/index.ts --out-dir=build/bg-032

      - name: Render check frames
        run: node scripts/campaign50/bg-032/stills.mjs build/bg-032

      - name: Render MP4 (H.264/AAC, yuv420p)
        run: npx remotion render build/bg-032 BalaGoBG032 "out/$OUT.mp4" --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac --log=warn

      - name: Faststart + preview copy (540×960)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-preview-540.mp4"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/campaign50/bg-032/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-032/verify.mjs "out/$OUT-preview-540.mp4" --mobile
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-032-mp4
          path: out/balago-bg-032.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload preview MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-032-preview-mp4
          path: out/balago-bg-032-preview-540.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-032-frames
          path: out/frames-bg-032/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: balago-bg-032-*mp4
          merge-multiple: true
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bg-032-preview
        run: |
          ls -la out
          NOTES="BalaGoBG032 (BG-032 «7, 12 или 20 километров?») — 1080×1920 30 fps оригинал и предпросмотр 540×960. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo-50 BG-032 — 7, 12 или 20 километров? (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "out/$OUT.mp4" "out/$OUT-preview-540.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-preview-540.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
