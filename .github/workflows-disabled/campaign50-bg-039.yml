name: BalaGo-50 BG-039 (выпуск №39, «Сапар үзгүлтүккө учурасачы?»)

# Выпуск №39 кампании BalaGo-50. Собирается ТОЛЬКО композиция BalaGoBG039
# (отдельная точка входа src/campaign50/bg-039/index.ts) — прежние ролики здесь
# не рендерятся, а общий render.yml пропускает пути кампании (paths-ignore).
# Этап задаёт scripts/campaign50/bg-039/stage.json:
#   "preview" — озвучка + контрольные кадры + предпросмотр 540×960
#               (релиз campaign50-bg-039-preview);
#   "final"   — озвучка из кэша + оригинал 1080×1920 30 fps H.264/AAC
#               (faststart) и копия 540×960 (релиз campaign50-bg-039).
#   voice   → реплики ElevenLabs готовыми кыргызскими голосами проекта
#             (3 дубля новой реплики, лучший по распознаванию MMS); готовые
#             (тот же хэш текста/голоса/настроек) повторно не синтезируются;
#             новые файлы сохраняются в ветку.
#   render  → lint/TypeScript, тесты правил, контрольные кадры, MP4.
#             Задача падает, если MP4 не создан или формат/длительность/звук
#             не те.
#   publish → MP4 файлами предварительного релиза (прямые ссылки на MP4).

on:
  push:
    paths:
      - "src/campaign50/bg-039/**"
      - "scripts/campaign50/bg-039/**"
      - "public/audio/campaign50/bg-039/**"
      - ".github/workflows/campaign50-bg-039.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-039-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-039
  ENTRY: src/campaign50/bg-039/index.ts

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-039/voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-039 ]; then git add public/audio/campaign50/bg-039; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(bg-039): save voice files [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-039/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-039-voice
          path: public/audio/campaign50/bg-039/
          retention-days: 30

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Stage (preview | final)
        id: stage
        run: |
          STAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scripts/campaign50/bg-039/stage.json','utf8')).stage)")
          case "$STAGE" in preview|final) ;; *) echo "::error::неизвестный этап $STAGE"; exit 1;; esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Этап: $STAGE" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (rules, compensation scale, final screen, voice timing)
        env:
          BG39_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-039/bg039.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Bundle (campaign entry point only)
        run: npx remotion bundle "$ENTRY" --out-dir=build/bg-039

      - name: Render check frames (0/25/50/75/100 % and scenes)
        run: node scripts/campaign50/bg-039/stills.mjs --bundle=build/bg-039 --scale=0.5

      - name: Render preview MP4 (540×960)
        if: steps.stage.outputs.stage == 'preview'
        run: |
          npx remotion render build/bg-039 BalaGoBG039 "out/$OUT-raw.mp4" --scale=0.5 --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT-raw.mp4" -c copy -movflags +faststart "out/$OUT-preview-540.mp4"
          rm "out/$OUT-raw.mp4"
          node scripts/campaign50/bg-039/verify.mjs "out/$OUT-preview-540.mp4" --mobile

      - name: Render final MP4 (1080×1920, H.264/AAC, yuv420p) + preview copy
        if: steps.stage.outputs.stage == 'final'
        run: |
          npx remotion render build/bg-039 BalaGoBG039 "out/$OUT-raw.mp4" --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT-raw.mp4" -c copy -movflags +faststart "out/$OUT.mp4"
          rm "out/$OUT-raw.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-preview-540.mp4"
          node scripts/campaign50/bg-039/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-039/verify.mjs "out/$OUT-preview-540.mp4" --mobile

      - name: List MP4
        run: ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-039-mp4
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-039-frames
          path: out/frames-bg-039/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-039-mp4
          path: out

      - name: Publish pre-release with MP4 files
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.render.outputs.stage }}
        run: |
          ls -la out
          if [ "$STAGE" = "final" ]; then
            TAG=campaign50-bg-039
            TITLE="BalaGo-50 BG-039 — Сапар үзгүлтүккө учурасачы? (1080×1920, на проверку владельцу)"
            FILES="out/$OUT.mp4 out/$OUT-preview-540.mp4"
          else
            TAG=campaign50-bg-039-preview
            TITLE="BalaGo-50 BG-039 — Сапар үзгүлтүккө учурасачы? (предпросмотр 540×960)"
            FILES="out/$OUT-preview-540.mp4"
          fi
          NOTES="BalaGoBG039 (выпуск №39, BG-039), этап $STAGE. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber $FILES
          {
            echo "### MP4 ($STAGE)"
            for f in $FILES; do echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
