name: BalaGo-50 BG-044 (выпуск №44, 2D-игра)

# Выпуск №44 / BG-044 «Деңгээл: мектептен алып кетүү». Собирается ТОЛЬКО
# композиция BalaGoBG044 из собственной точки входа src/campaign50/bg-044/index.ts
# (общие src/Root.tsx, src/index.ts и прежние ролики не участвуют). Массовый
# render.yml эти пути игнорирует (paths-ignore: src/campaign50/**,
# scripts/campaign50/**, public/*/campaign50/**, campaign50-*.yml).
#
#   voice   → реплики ElevenLabs готовыми кыргызскими голосами проекта
#             (3 дубля новой реплики, лучший по распознаванию MMS); MP3 с тем
#             же хэшем повторно не запрашиваются, новые коммитятся в ветку.
#   render  → lint/TypeScript, проверки сценария, контрольные кадры и MP4:
#             • обычный push — ПРЕДПРОСМОТР 540×960 (дёшево, для проверки);
#             • финал (ручной запуск с final=true или «[final]» в сообщении
#               коммита) — оригинал 1080×1920 30 fps H.264/AAC + мобильная копия
#               540×960; всё с faststart, проверка формата/длительности/звука.
#   publish → MP4 файлами предварительного релиза campaign50-bg-044-preview
#             (прямые ссылки на .mp4, не ZIP).
# «[voice-only]» в сообщении коммита — только озвучка (без рендера и релиза).

on:
  push:
    branches:
      - "feature/bg-044-episode-44"
    paths:
      - "src/campaign50/bg-044/**"
      - "scripts/campaign50/bg-044/**"
      - "public/audio/campaign50/bg-044/**"
      - "public/assets/campaign50/bg-044/**"
      - ".github/workflows/campaign50-bg-044.yml"
  workflow_dispatch:
    inputs:
      final:
        description: "Финальный рендер 1080×1920 (иначе — предпросмотр 540×960)"
        type: boolean
        default: false

concurrency:
  group: campaign50-bg-044-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-044
  ENTRY: src/campaign50/bg-044/index.ts
  FINAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.final) || contains(github.event.head_commit.message, '[final]') }}

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/campaign50/bg-044/requirements-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/campaign50/bg-044/requirements-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-044/voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-044/voice ]; then git add public/audio/campaign50/bg-044/voice; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(bg-044): save voice files [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-044/voice/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-044-voice
          path: public/audio/campaign50/bg-044/voice/
          retention-days: 30

  render:
    needs: voice
    if: ${{ !contains(github.event.head_commit.message, '[voice-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npx eslint src/campaign50/bg-044 && npx tsc

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Script checks (Kyrgyz text, CTA, timeline, voice)
        env:
          BG44_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-044/check.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames (0/25/50/75/100 %, every scene, every line)
        run: node scripts/campaign50/bg-044/stills.mjs --voice --scale 0.5

      - name: Render preview MP4 (540×960, real voice)
        if: env.FINAL != 'true'
        run: |
          npx remotion render "$ENTRY" BalaGoBG044 "out/$OUT-preview-540.mp4" \
            --scale=0.5 --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT-preview-540.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT-preview-540.mp4"
          node scripts/campaign50/bg-044/verify.mjs "out/$OUT-preview-540.mp4" --mobile
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Render original MP4 (H.264/AAC, yuv420p, 1080×1920, 30 fps)
        if: env.FINAL == 'true'
        run: |
          npx remotion render "$ENTRY" BalaGoBG044 "out/$OUT.mp4" \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn

      - name: Faststart + mobile copy (540×960)
        if: env.FINAL == 'true'
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile.mp4"

      - name: Verify MP4 files (fail if missing or wrong format)
        if: env.FINAL == 'true'
        run: |
          node scripts/campaign50/bg-044/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-044/verify.mjs "out/$OUT-mobile.mp4" --mobile
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4 files
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-044-mp4
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-044-frames
          path: out/frames-bg-044/*.png
          if-no-files-found: warn
          retention-days: 30

  # MP4 — файлами предварительного релиза: прямые ссылки на .mp4.
  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-044-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: campaign50-bg-044-preview
        run: |
          ls -la out
          KIND="предпросмотр 540×960"
          if [ "$FINAL" = "true" ]; then KIND="оригинал 1080×1920 + мобильная копия 540×960"; fi
          NOTES="BalaGo-50 №44 / BG-044 «Деңгээл: мектептен алып кетүү» — ${KIND} (не принят владельцем). Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo-50 №44 BG-044 — Деңгээл: мектептен алып кетүү (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*.mp4
          {
            echo "### MP4 ($KIND)"
            for f in out/*.mp4; do
              echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$(basename "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
