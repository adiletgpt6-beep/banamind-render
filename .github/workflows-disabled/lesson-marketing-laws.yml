name: BanaMind BM-011 — «22 непреложных закона маркетинга» (банан, 30 мин, 16:9)

# Анимационный обзор книги с бананом-ведущим (канал BanaMind, не BalaGo).
# Своя точка входа Remotion src/lesson-marketing-laws/index.ts, другие фильмы не трогает.
#   voice    → озвучка ElevenLabs по репликам (готовые с тем же хэшем
#              переиспользуются), новые файлы сохраняются в ветку.
#   render   → 8 параллельных частей кадров (без звука), 1920×1080 30 fps.
#              «[pilot]» в сообщении коммита — только первые 60 с (пилот);
#              «[no render]» — без рендера (озвучка, тесты, файлы релиза).
#   assemble → склейка без пережатия, звук по тайм-лайну, AAC + faststart, SRT,
#              проверки формата/длительности/звука, копия 960×540, контрольные кадры.
#   release  → приватный pre-release book-22-laws-of-marketing (вход в GitHub нужен):
#              final-youtube.mp4, превью, SRT, сценарий, обложки, лист обложек.
# YouTube-публикации здесь нет и не будет: публикует только владелец после проверки прав.

on:
  push:
    paths:
      - "src/lesson-marketing-laws/**"
      - "src/banana-host/**"
      - "src/banamind/**"
      - "scripts/lesson-marketing-laws/**"
      - "public/lesson-marketing-laws/**"
      - "books/22-laws-of-marketing/**"
      - ".github/workflows/lesson-marketing-laws.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "full | pilot | none (только озвучка и файлы релиза)"
        default: "full"

concurrency:
  group: lesson-marketing-laws-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: marketing_laws_banamind_30min
  TAG: book-22-laws-of-marketing

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.save.outputs.sha }}
      ranges: ${{ steps.plan.outputs.ranges }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/lesson-marketing-laws/voice.mjs

      - name: Save new voice files to the branch
        id: save
        if: always() && github.ref_name != 'main'
        run: |
          [ -d public/lesson-marketing-laws/voice ] && git add public/lesson-marketing-laws/voice
          if ! git diff --cached --quiet; then
            git diff --cached --stat | tail -3
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(BM-011): save voice files [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tests and render plan
        id: plan
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          node --test scripts/lesson-marketing-laws/*.test.mjs
          node scripts/lesson-marketing-laws/captions-check.mjs > /tmp/captions.json || { cat /tmp/captions.json; exit 1; }
          tail -n 12 /tmp/captions.json
          mode=full
          [[ "$MSG" == *"[pilot]"* ]] && mode=pilot
          [[ "$MSG" == *"[no render]"* ]] && mode=none
          [ -n "$INPUT_MODE" ] && mode="$INPUT_MODE"
          if [ "$mode" = pilot ]; then
            echo 'ranges=["0-1799"]' >> "$GITHUB_OUTPUT"
          else
            P=$(node scripts/lesson-marketing-laws/frames.mjs 8)
            echo "$P"
            echo "ranges=$(echo "$P" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)["ranges"]))')" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"

  render:
    needs: voice
    if: needs.voice.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        range: ${{ fromJSON(needs.voice.outputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render frames ${{ matrix.range }} (muted, H.264)
        run: |
          mkdir -p out/parts
          N=$(echo "${{ matrix.range }}" | cut -d- -f1)
          npx remotion render src/lesson-marketing-laws/index.ts MarketingLawsLesson "out/parts/part-$(printf %06d "$N").mp4" \
            --frames=${{ matrix.range }} --muted --codec=h264 --pixel-format=yuv420p --color-space=bt709 \
            --crf=18 --x264-preset=medium --concurrency=100% --log=warn
          ls -la out/parts

      - uses: actions/upload-artifact@v4
        with:
          name: laws-part-${{ strategy.job-index }}
          path: out/parts/*.mp4
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: laws-part-*
          path: out/parts
          merge-multiple: true

      - name: Concat video, mix audio, mux (AAC 192k, faststart)
        run: |
          ls out/parts/*.mp4 | sort | sed "s/^/file '/; s/$/'/; s/out\/parts\///" > out/parts/list.txt
          cat out/parts/list.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i out/parts/list.txt -c copy out/video.mp4
          node scripts/lesson-marketing-laws/mixdown.mjs out/audio.wav
          ffmpeg -hide_banner -loglevel error -y -i out/video.mp4 -i out/audio.wav -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k -ar 48000 -shortest -movflags +faststart "out/$OUT.mp4"
          node scripts/lesson-marketing-laws/srt.mjs "out/$OUT.srt"

      - name: Verify MP4
        if: needs.voice.outputs.mode == 'full'
        run: node scripts/lesson-marketing-laws/verify.mjs "out/$OUT.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pilot (60 s) — format check
        if: needs.voice.outputs.mode == 'pilot'
        run: |
          mv "out/$OUT.mp4" out/pilot-60s.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of compact out/pilot-60s.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
          ffmpeg -hide_banner -nostats -i out/pilot-60s.mp4 -vn -af ebur128 -f null - 2>&1 | tail -n 12 | grep -E "I:|LRA:" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preview copy (960×540) and check frames
        if: needs.voice.outputs.mode == 'full'
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -vf scale=960:540:flags=lanczos -c:v libx264 -preset medium -crf 26 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "out/$OUT-preview-960x540.mp4"
          mkdir -p out/frames
          for s in 5 300 600 900 1200 1500 1790; do
            ffmpeg -hide_banner -loglevel error -y -ss $s -i "out/$OUT.mp4" -frames:v 1 -vf scale=960:-2 "out/frames/t$(printf %04d $s).jpg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: marketing-laws-mp4
          path: |
            out/*.mp4
            out/*.srt
            out/frames/*.jpg
          if-no-files-found: error
          retention-days: 30

      - name: Publish to private pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.voice.outputs.mode }}
        run: |
          NOTES="BanaMind BM-011 «22 непреложных закона маркетинга» (Эл Рис, Джек Траут) — анимационный обзор с бананом-ведущим, русский, 1920×1080, 30 fps, H.264/AAC. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Приватный репозиторий: для скачивания нужен вход в GitHub. На YouTube не публиковать без проверки прав."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "22 закона маркетинга — BanaMind (BM-011)" --notes "$NOTES" --prerelease --target "${{ needs.voice.outputs.sha }}"
          fi
          if [ "$MODE" = pilot ]; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/pilot-60s.mp4
          else
            mkdir -p out/rel
            ln -f "out/$OUT.mp4" out/rel/final-youtube.mp4
            cp "out/$OUT.srt" out/rel/final-youtube.srt
            ln -f "out/$OUT-preview-960x540.mp4" out/rel/final-youtube-preview-960x540.mp4
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/rel/final-youtube.mp4 out/rel/final-youtube.srt out/rel/final-youtube-preview-960x540.mp4
          fi
          {
            echo "### Файлы ($MODE)"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  release-files:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - name: Upload script, metadata and thumbnails to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=books/22-laws-of-marketing
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "22 закона маркетинга — BanaMind (BM-011)" --notes "BanaMind BM-011: файлы появятся после рендера. Приватно, вход в GitHub нужен." --prerelease --target "${{ needs.voice.outputs.sha }}"
          fi
          files=()
          for f in $D/SCRIPT.md $D/SOURCE_MAP.md $D/BRIEF.md $D/metadata/YOUTUBE_TITLES.md $D/metadata/youtube.md \
                   $D/thumbnails/thumbnail-0{1,2,3,4,5}.jpg $D/thumbnails/thumbnail-contact-sheet.jpg $D/thumbnails/readability-320x180.jpg; do
            [ -f "$f" ] && files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] && gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          echo "uploaded: ${files[*]}"
