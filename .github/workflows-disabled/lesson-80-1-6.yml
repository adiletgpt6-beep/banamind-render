name: LESSON-80-1-6 «Кто научил птицу строить гнездо?»

# Образовательный мини-фильм 80-1-6 (1920×1080, 30 к/с, ≈ 4:30). Собирается
# только эта композиция.
#   voice  → озвучка: ElevenLabs (ELEVENLABS_API_KEY) или OpenAI
#            (OPENAI_API_KEY), иначе офлайн RHVoice; готовые реплики
#            (тот же хэш) переиспользуются; новые файлы сохраняются в ветку.
#   render → lint/TypeScript, тесты (45 реплик, паузы 4/4/5/4 с, 25 учеников,
#            план птицы), контрольные кадры, MP4 H.264/AAC, проверка ffprobe.
#   publish → MP4 и просмотровая копия 720p как файлы предварительного релиза
#            lesson-80-1-6-preview (прямые ссылки на MP4, не ZIP).
on:
  push:
    paths:
      - "src/lesson80/**"
      - "scripts/lesson80/**"
      - "scripts/lesson80-1-6.test.mjs"
      - "public/lesson-80-1-6/**"
      - ".github/workflows/lesson-80-1-6.yml"
  workflow_dispatch:

concurrency:
  group: lesson-80-1-6-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: lesson-80-1-6-bird-nest

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install FFmpeg and RHVoice (offline Russian TTS fallback)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg rhvoice rhvoice-russian
      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/lesson80/generate-voice.mjs
      - name: Ambience sound effects
        run: node scripts/lesson80/sfx.mjs
      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          git add public/lesson-80-1-6/audio
          if git diff --cached --quiet; then echo "Новых файлов озвучки нет."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save lesson-80-1-6 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 5
          done
          exit 1

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint + TypeScript
        run: npm run lint
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tests (script, pauses, characters, bird plan, voice)
        env:
          L80_STRICT_VOICE: "1"
        run: npm run test:lesson-80-1-6
      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure
      - name: Bundle
        run: npm run bundle
      - name: Render check frames
        run: npm run stills:lesson-80-1-6 -- --quick
      - name: Render MP4 (H.264/AAC, 1920×1080, 30 fps)
        run: npm run render:lesson-80-1-6 -- --log=warn
      - name: Faststart + preview copy (1280×720)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=1280:720 -r 30 -c:v libx264 -profile:v high -preset slow -crf 23 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "out/$OUT-720p.mp4"
      - name: Verify MP4
        run: |
          npm run verify:lesson-80-1-6 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-80-1-6-mp4
          path: |
            out/lesson-80-1-6-bird-nest.mp4
            out/lesson-80-1-6-bird-nest-720p.mp4
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-80-1-6-frames
          path: out/frames-lesson-80-1-6-bird-nest/*.png
          if-no-files-found: warn
          retention-days: 30

  # Оба MP4 — файлами предварительного релиза: прямые ссылки для скачивания.
  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lesson-80-1-6-mp4
          path: out
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: lesson-80-1-6-preview
        run: |
          ls -la out
          NOTES="LESSON-80-1-6 «Кто научил птицу строить гнездо?» — предварительный просмотр. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "LESSON-80-1-6 — «Кто научил птицу строить гнездо?» (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$OUT.mp4" "out/$OUT-720p.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-720p.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
