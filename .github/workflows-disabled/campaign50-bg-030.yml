name: BalaGo-50 BG-030 (выпуск №31, 2D)

# Выпуск №31 / BG-030 «Бишкектеги бир каттам» («Один маршрут по Бишкеку»).
# Собирается ТОЛЬКО композиция BalaGoBG030 из собственной точки входа
# src/campaign50/bg-030/index.ts (общие src/Root.tsx, src/index.ts и прежние
# ролики не участвуют). Массовый render.yml эти пути игнорирует.
#   voice   → реплики ElevenLabs готовыми кыргызскими голосами проекта
#             (3 дубля, лучший по распознаванию MMS); сохранённые MP3
#             повторно не запрашиваются, новые коммитятся в ветку; без
#             утверждения сценария и без распознавания синтез не начинается.
#   render  → lint/TypeScript, проверки сценария, контрольные кадры,
#             MP4 1080×1920 30 fps H.264/AAC + мобильная копия 540×960,
#             обе с faststart; проверка формата, длительности и звука.
#   publish → оба MP4 файлами предварительного релиза bg-030-preview
#             (прямые ссылки на MP4), тег — на собранный коммит.

on:
  push:
    branches:
      - "claude/balago-video-31-prep-09idy8"
    paths:
      - "src/campaign50/bg-030/**"
      - "scripts/campaign50/bg-030/**"
      - "public/audio/campaign50/bg-030/**"
      - "public/assets/campaign50/bg-030/**"
      - ".github/workflows/campaign50-bg-030.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-030-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-030
  ENTRY: src/campaign50/bg-030/index.ts

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Voice plan (free)
        run: node scripts/campaign50/bg-030/voice.mjs --plan

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/campaign50/bg-030/requirements-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/campaign50/bg-030/requirements-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-030/voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-030/voice ]; then git add public/audio/campaign50/bg-030/voice; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save BG-030 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-030/voice/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-030-voice
          path: public/audio/campaign50/bg-030/voice/
          retention-days: 30

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Rendered commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npx eslint src/campaign50/bg-030 && npx tsc

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Script checks (Kyrgyz text, CTA, timeline, voice)
        env:
          BG30_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-030/check.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames (0/25/50/75/100 %, scenes, lines)
        env:
          STILL_SCALE: "0.5"
        run: node scripts/campaign50/bg-030/stills.mjs --voice

      - name: Render MP4 (H.264/AAC, yuv420p, 1080×1920, 30 fps)
        run: |
          npx remotion render "$ENTRY" BalaGoBG030 "out/$OUT.mp4" \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn

      - name: Faststart + mobile copy (540×960)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile.mp4"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/campaign50/bg-030/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-030/verify.mjs "out/$OUT-mobile.mp4" --mobile
          sha256sum out/*.mp4 | tee out/SHA256SUMS.txt
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-030-mp4
          path: |
            out/balago-bg-030.mp4
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload mobile MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-030-mobile-mp4
          path: out/balago-bg-030-mobile.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-030-frames
          path: out/frames-bg-030/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: balago-bg-030-*mp4
          merge-multiple: true
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bg-030-preview
          SHA: ${{ needs.render.outputs.sha }}
        run: |
          ls -la out
          SUMS=$(cat out/SHA256SUMS.txt 2>/dev/null | sed 's|out/||' || true)
          NOTES="BalaGoBG030 (выпуск №31, «Бишкектеги бир каттам») — предварительный просмотр, не принят владельцем. Ветка ${GITHUB_REF_NAME}, собранный коммит ${SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          SHA-256:
          ${SUMS}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # тег переносится на собранный коммит
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="$SHA" -F force=true >/dev/null || true
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №31 BG-030 «Бишкектеги бир каттам» — 2D (предпросмотр)" --notes "$NOTES" --prerelease --target "$SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$OUT.mp4" "out/$OUT-mobile.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-mobile.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
