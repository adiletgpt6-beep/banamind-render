name: BalaGo-50 BG-033 (выпуск №33, 2D)

# Выпуск №33 / BG-033 «Алгач сынап көрүңүз». Собирается ТОЛЬКО композиция
# BalaGoBG033 из собственной точки входа src/campaign50/bg-033/index.ts
# (общие src/Root.tsx, src/index.ts, пилот BG-032 и прежние ролики не участвуют).
# Массовый render.yml эти пути игнорирует (paths-ignore: src/campaign50/**,
# scripts/campaign50/**, public/*/campaign50/**, campaign50-*.yml).
#
# Стадия — файл scripts/campaign50/bg-033/stage.json или ввод workflow_dispatch:
#   voice   → только озвучка ElevenLabs (реплики из кэша не запрашиваются);
#   preview → озвучка из кэша + дешёвый предпросмотр 540×960 в релиз;
#   final   → один оригинал 1080×1920 30 fps H.264/AAC (faststart) + копия
#             540×960 для просмотра на телефоне, оба файла в релиз.
#   voice   → 3 дубля новой реплики, лучший по распознаванию MMS; новые MP3
#             коммитятся в ветку ботом (это не запускает workflow повторно).
#   publish → предварительный релиз bg-033-preview (прямые ссылки на MP4).

on:
  push:
    branches:
      - "ccr-988fbfcc-ikstft"
    paths:
      - "src/campaign50/bg-033/**"
      - "scripts/campaign50/bg-033/**"
      - "public/audio/campaign50/bg-033/**"
      - "public/assets/campaign50/bg-033/**"
      - ".github/workflows/campaign50-bg-033.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "voice | preview | final (пусто — из stage.json)"
        required: false
        default: ""

concurrency:
  group: campaign50-bg-033-${{ github.ref }}
  # не отменять: прерванная озвучка потеряла бы уже оплаченные дубли
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-033
  ENTRY: src/campaign50/bg-033/index.ts

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: stage
        name: Stage
        env:
          INPUT_STAGE: ${{ github.event.inputs.stage }}
        run: |
          STAGE="${INPUT_STAGE:-$(node -p "require('./scripts/campaign50/bg-033/stage.json').stage")}"
          case "$STAGE" in voice|preview|final) ;; *) echo "::error::неизвестная стадия $STAGE"; exit 1;; esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "### Стадия: $STAGE" >> "$GITHUB_STEP_SUMMARY"

  voice:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - id: need
        name: Is synthesis needed? (no API call)
        run: |
          set +e
          node scripts/campaign50/bg-033/voice.mjs --check
          code=$?
          set -e
          if [ "$code" = "2" ]; then echo "need=true" >> "$GITHUB_OUTPUT"; elif [ "$code" = "0" ]; then echo "need=false" >> "$GITHUB_OUTPUT"; else exit "$code"; fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.need == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/campaign50/bg-033/requirements-asr.txt

      - name: Install MMS speech recognition
        if: steps.need.outputs.need == 'true'
        run: pip install --quiet -r scripts/campaign50/bg-033/requirements-asr.txt

      - name: Cache MMS model
        if: steps.need.outputs.need == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        if: steps.need.outputs.need == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-033/voice.mjs

      - name: Save new voice files to the branch
        if: always() && steps.need.outputs.need == 'true' && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-033/voice ]; then git add public/audio/campaign50/bg-033/voice; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save BG-033 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-033/voice/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-033-voice
          path: public/audio/campaign50/bg-033/voice/
          retention-days: 30

  render:
    needs: [plan, voice]
    if: needs.plan.outputs.stage != 'voice'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npx eslint src/campaign50/bg-033 && npx tsc

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Script checks (Kyrgyz text, CTA, timeline, voice)
        env:
          BG33_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-033/check.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames (540×960)
        env:
          STILL_SCALE: "0.5"
        run: node scripts/campaign50/bg-033/stills.mjs --voice

      - name: Render preview MP4 (540×960)
        if: needs.plan.outputs.stage == 'preview'
        run: |
          npx remotion render "$ENTRY" BalaGoBG033 "out/$OUT-preview-540x960.mp4" --scale=0.5 \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac --crf=24 \
            --props='{"requireVoice":true}' --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT-preview-540x960.mp4" -c copy -movflags +faststart "out/fs.mp4"
          mv out/fs.mp4 "out/$OUT-preview-540x960.mp4"
          node scripts/campaign50/bg-033/verify.mjs "out/$OUT-preview-540x960.mp4" --mobile

      - name: Render final MP4 (H.264/AAC, yuv420p, 1080×1920, 30 fps) + mobile copy
        if: needs.plan.outputs.stage == 'final'
        run: |
          npx remotion render "$ENTRY" BalaGoBG033 "out/$OUT.mp4" \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/fs.mp4"
          mv out/fs.mp4 "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile.mp4"
          node scripts/campaign50/bg-033/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-033/verify.mjs "out/$OUT-mobile.mp4" --mobile

      - name: Checksums
        run: |
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-033-mp4
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-033-frames
          path: out/frames-bg-033/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-033-mp4
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bg-033-preview
          SHA: ${{ needs.render.outputs.sha }}
          STAGE: ${{ needs.plan.outputs.stage }}
        run: |
          ls -la out
          NOTES="BalaGoBG033 (выпуск №33, «Алгач сынап көрүңүз») — стадия ${STAGE}. Ветка ${GITHUB_REF_NAME}, коммит ${SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №33 BG-033 «Алгач сынап көрүңүз» — 2D (предпросмотр)" --notes "$NOTES" --prerelease --target "$SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*.mp4
          {
            echo "### MP4 (${STAGE})"
            for f in out/*.mp4; do echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
