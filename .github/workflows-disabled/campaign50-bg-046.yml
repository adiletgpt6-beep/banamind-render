name: BalaGo-50 BG-046 (выпуск №46, 2D)

# Выпуск №46 / BG-046 «Мектеп сумкасынын монологу». Собирается ТОЛЬКО
# композиция BalaGoBG046 из собственной точки входа
# src/campaign50/bg-046/index.ts (общие src/Root.tsx, src/index.ts и прежние
# ролики не участвуют). Массовый render.yml эти пути игнорирует
# (paths-ignore: src/campaign50/**, scripts/campaign50/**,
# public/*/campaign50/**, campaign50-*.yml).
#   voice   → реплики ElevenLabs готовыми кыргызскими голосами проекта
#             (3 дубля новой реплики, лучший по распознаванию MMS);
#             сохранённые MP3 повторно не запрашиваются (кэш по хэшу),
#             новые коммитятся в ветку.
#   render  → lint/TypeScript, проверки сценария, контрольные кадры,
#             облегчённое превью 540×960; финальный MP4 1080×1920 30 fps
#             H.264/AAC + мобильная копия — только если в
#             scripts/campaign50/bg-046/render-stage.json "final": true
#             (один целевой рендер). Все файлы с faststart и проверкой
#             формата, длительности и звука.
#   publish → превью — в релиз bg-046-preview, финальный MP4 и мобильная
#             копия — в отдельный релиз bg-046 (прямые ссылки на MP4; превью
#             не смешивается с финалом). Релиз указывает на коммит, который
#             действительно отрендерен. Файлы скачиваются обратно из релиза
#             и проверяются ещё раз (sha256 + формат).

on:
  push:
    branches:
      - "feature/bg-046-episode-46"
    paths:
      - "src/campaign50/bg-046/**"
      - "scripts/campaign50/bg-046/**"
      - "public/audio/campaign50/bg-046/**"
      - "public/assets/campaign50/bg-046/**"
      - ".github/workflows/campaign50-bg-046.yml"
  workflow_dispatch:

concurrency:
  group: campaign50-bg-046-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-046
  ENTRY: src/campaign50/bg-046/index.ts
  TAG: bg-046-preview
  TAG_FINAL: bg-046

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/campaign50/bg-046/requirements-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/campaign50/bg-046/requirements-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-046/voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-046/voice ]; then git add public/audio/campaign50/bg-046/voice; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save BG-046 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-046/voice/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-046-voice
          path: public/audio/campaign50/bg-046/voice/
          retention-days: 30

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      final: ${{ steps.stage.outputs.final }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Rendered commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npx eslint src/campaign50/bg-046 && npx tsc

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Script checks (Kyrgyz text, сиз, CTA, timeline, voice)
        env:
          BG46_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-046/check.test.mjs

      - name: Render stage (preview only or one final render)
        id: stage
        run: |
          FINAL=$(node -p "JSON.parse(require('fs').readFileSync('scripts/campaign50/bg-046/render-stage.json','utf8')).final === true")
          echo "final=$FINAL" >> "$GITHUB_OUTPUT"
          echo "Финальный рендер 1080×1920: $FINAL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames
        run: node scripts/campaign50/bg-046/stills.mjs --voice

      - name: Render preview MP4 (540×960)
        run: |
          npx remotion render "$ENTRY" BalaGoBG046 "out/$OUT-preview-raw.mp4" \
            --scale=0.5 --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT-preview-raw.mp4" -c copy -movflags +faststart "out/$OUT-preview.mp4"
          rm "out/$OUT-preview-raw.mp4"
          node scripts/campaign50/bg-046/verify.mjs "out/$OUT-preview.mp4" --mobile

      - name: Render final MP4 (H.264/AAC, yuv420p, 1080×1920, 30 fps)
        if: steps.stage.outputs.final == 'true'
        run: |
          npx remotion render "$ENTRY" BalaGoBG046 "out/$OUT-raw.mp4" \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT-raw.mp4" -c copy -movflags +faststart "out/$OUT.mp4"
          rm "out/$OUT-raw.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile.mp4"
          node scripts/campaign50/bg-046/verify.mjs "out/$OUT.mp4"
          node scripts/campaign50/bg-046/verify.mjs "out/$OUT-mobile.mp4" --mobile

      - name: Control frames 0 / 25 / 50 / 75 / 100 % from the MP4
        run: |
          SRC="out/$OUT.mp4"; [ -f "$SRC" ] || SRC="out/$OUT-preview.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$SRC")
          mkdir -p out/mp4-frames
          for P in 0 25 50 75 100; do
            T=$(node -p "Math.max(0, Math.min($DUR - 0.05, $DUR * $P / 100)).toFixed(3)")
            ffmpeg -hide_banner -loglevel error -y -ss "$T" -i "$SRC" -frames:v 1 "out/mp4-frames/pct-$P.png"
          done
          ls -la out/*.mp4 out/mp4-frames | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum out/*.mp4 | tee out/sha256.txt

      - name: Upload MP4 files
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-046-mp4
          path: |
            out/*.mp4
            out/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-046-frames
          path: |
            out/frames-bg-046/*.png
            out/mp4-frames/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SHA: ${{ needs.render.outputs.sha }}
      FINAL: ${{ needs.render.outputs.final }}
    steps:
      # Тот же коммит, что отрендерен (manifest.json озвучки для verify.mjs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.render.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/download-artifact@v4
        with:
          name: balago-bg-046-mp4
          path: out

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release() { # tag title notes files…
            local tag="$1" title="$2" notes="$3"; shift 3
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" -R "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease --target "$SHA"
            else
              gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease --target "$SHA"
            fi
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "$@"
            for f in "$@"; do echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$tag/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"; done
          }
          echo "### MP4" >> "$GITHUB_STEP_SUMMARY"
          release "$TAG" "BalaGo №46 BG-046 «Мектеп сумкасынын монологу» — превью 540×960" \
            "BalaGoBG046 (выпуск №46) — облегчённое превью 540×960. Коммит ${SHA::7}, ветка ${GITHUB_REF_NAME}, прогон $RUN." \
            "out/$OUT-preview.mp4"
          if [ "$FINAL" = "true" ]; then
            release "$TAG_FINAL" "BalaGo №46 BG-046 «Мектеп сумкасынын монологу» — 2D, 1080×1920" \
              "BalaGoBG046 (выпуск №46) — финальный рендер 1080×1920, 30 fps, H.264/AAC, faststart; мобильная копия 540×960. Коммит ${SHA::7}, ветка ${GITHUB_REF_NAME}, прогон $RUN. Ждёт просмотра владельцем." \
              "out/$OUT.mp4" "out/$OUT-mobile.mp4"
          fi

      - name: Download back from the releases and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rel
          check() { # tag name [--mobile]
            gh release download "$1" -R "$GITHUB_REPOSITORY" -p "$2" -D rel --clobber
            A=$(sha256sum "out/$2" | cut -d' ' -f1); B=$(sha256sum "rel/$2" | cut -d' ' -f1)
            [ "$A" = "$B" ] || { echo "::error::$2 в релизе $1 отличается от рендера"; exit 1; }
            node scripts/campaign50/bg-046/verify.mjs "rel/$2" $3
            echo "✓ $1/$2 sha256 $B" >> "$GITHUB_STEP_SUMMARY"
          }
          check "$TAG" "$OUT-preview.mp4" --mobile
          if [ "$FINAL" = "true" ]; then
            check "$TAG_FINAL" "$OUT.mp4"
            check "$TAG_FINAL" "$OUT-mobile.mp4" --mobile
          fi
