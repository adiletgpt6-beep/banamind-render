name: Lesson80-1-4-OneCreator-KY (lesson-80, 80-1-4, кыргызча, 16:9)

# Кыргызская версия мини-фильма 4 урока 1 («Один Создатель»):
#   voice → озвучка 47 реплик ElevenLabs eleven_v3, язык ky (готовые дубли не
#           синтезируются); новые файлы сохраняются в ветку.
#   asr   → проверка каждого дубля и каждой готовой реплики распознаванием:
#           Whisper кыргызский не поддерживает — Meta MMS (facebook/mms-1b-all,
#           адаптер kir) на CPU, 4 параллельные части;
#   save-asr → сводит части в docs/lesson80-1-4/voice-asr.ky.json и сохраняет в ветку.
# Видео рендерится локально: npm run render:80-1-4-ky
#   → out/lesson-80-1-4-one-creator-ky-16x9.mp4

on:
  push:
    paths:
      - "src/lesson80-1-4/script.ky.ts"
      - "src/lesson80-1-4/voices.ky.json"
      - "scripts/lesson80-1-4-voice.mjs"
      - "scripts/lesson80-1-4-asr.py"
      - "scripts/requirements-ts2d-asr.txt"
      - "public/audio/lesson80-1-4-ky/manifest.json"
      - ".github/workflows/lesson80-1-4-ky.yml"
  workflow_dispatch:

concurrency:
  group: lesson80-1-4-ky-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Voiceover in Kyrgyz (cached takes are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/lesson80-1-4-voice.mjs --lang=ky

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/lesson80-1-4-ky ]; then git add public/audio/lesson80-1-4-ky; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat | tail -3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save lesson 80-1-4 (ky) voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  asr:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Recognise takes and built lines (part ${{ matrix.shard }} of 4)
        timeout-minutes: 65
        run: python3 scripts/lesson80-1-4-asr.py docs/lesson80-1-4/voice-asr.ky.json --lang ky --shard ${{ matrix.shard }}/4 --part asr-ky-part-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-ky-part-${{ matrix.shard }}
          path: asr-ky-part-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 3

  save-asr:
    needs: asr
    if: always() && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: asr-ky-part-*
          merge-multiple: true
          path: asr-parts

      - name: Merge recognition results and save to the branch
        run: |
          python3 scripts/lesson80-1-4-asr.py docs/lesson80-1-4/voice-asr.ky.json --lang ky --merge asr-parts/*.json
          git add docs/lesson80-1-4/voice-asr.ky.json
          if git diff --cached --quiet; then
            echo "Новых результатов распознавания нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save lesson 80-1-4 (ky) voice recognition check"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
