name: BalaGo34ExtraLine (2D, №34)

# 2D-фильм №34 «Лишняя строка в объявлении» (Жарыядагы ашыкча сап),
# BalaGo34ExtraLine. Собирается только эта композиция.
#   voice   → пробы голосов-кандидатов на коротких репликах (до массовой
#             генерации; голоса ролей выбираются по report.json) → реплики
#             ElevenLabs (кэш по хэшу; новая реплика — 3 дубля, лучший по
#             MMS) → звуки действий; новые файлы сохраняются в ветку.
#   render  → lint/TypeScript, тесты, контрольные кадры, MP4 1080×1920,
#             −16 LUFS (true peak ≤ −1 dBTP), проверка каждой реплики в
#             готовом звуке (громкость и распознавание MMS), копия 540×960
#             (обе с faststart).
#   publish → оба MP4 файлами предварительного релиза extra-line-34-preview
#             (прямые ссылки на MP4).

on:
  push:
    branches-ignore: [main]
    paths:
      - "src/extra-line-34/**"
      - "src/BalaGo34ExtraLine.tsx"
      - "scripts/*el34*"
      - "scripts/lib/el34-*"
      - "scripts/extra-line-34.test.mjs"
      - "public/audio/extra-line-34/**"
      - ".github/workflows/extra-line-34.yml"
      # общие входы рендера этого фильма
      - "src/Root.tsx"
      - "src/fonts.ts"
      - "public/fonts/**"
      - "public/assets/logo.png"
      - "package.json"
      - "package-lock.json"
      - "remotion.config.ts"
  workflow_dispatch:

concurrency:
  group: extra-line-34-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-34-extra-line

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    outputs:
      saved: ${{ steps.save.outputs.saved }}
      complete: ${{ steps.complete.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-el34-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/requirements-el34-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-agegender-v1

      - name: Voice probes (once per configuration)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/el34-voice-probe.mjs

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generate-el34-voice.mjs

      - name: Room tone, music bed and action sounds (deterministic synthesis)
        run: node scripts/el34-sound.mjs

      - name: Voice complete?
        id: complete
        run: |
          node -e "const t=require('./public/audio/extra-line-34/timeline.json'); process.stdout.write('complete='+(!t.partial)+'\n')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Save new voice files to the branch
        id: save
        if: always() && github.ref_name != 'main'
        run: |
          git add public/audio/extra-line-34
          if [ -d voice-samples/extra-line-34 ]; then git add voice-samples/extra-line-34; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save extra-line-34 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "saved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-extra-line-34-voice
          path: |
            public/audio/extra-line-34/
            voice-samples/extra-line-34/
          retention-days: 30
          if-no-files-found: ignore

  # Коммит с новыми файлами (GITHUB_TOKEN) не запускает новый прогон:
  # шкала сначала сверяется с фактической речью, затем следующий push собирает
  # ролик. Без полной озвучки ролик не собирается.
  render:
    needs: voice
    if: needs.voice.outputs.saved != 'true' && needs.voice.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (timeline, voices, texts, story continuity)
        env:
          EL34_STRICT_VOICE: "1"
        run: node --test scripts/extra-line-34.test.mjs

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Bundle
        run: npm run bundle

      - name: Render check frames
        run: npm run stills:extra-line-34

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-extra-line-34-frames
          path: out/frames-extra-line-34/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Render MP4 (H.264/AAC, yuv420p, 1080×1920)
        run: npm run render:extra-line-34 -- --log=warn

      - name: Loudness −16 LUFS + faststart + mobile copy (540×960)
        run: |
          node scripts/el34-master.mjs "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 23 \
            -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart \
            "out/$OUT-mobile.mp4"

      - name: Every line is audible in the exported MP4
        run: |
          set -o pipefail
          node scripts/el34-speech-check.mjs "out/$OUT.mp4"
          node scripts/el34-speech-check.mjs "out/$OUT-mobile.mp4"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-el34-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/requirements-el34-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-agegender-v1

      - name: Every line is recognised in the exported MP4 (MMS)
        run: |
          set -o pipefail
          node scripts/el34-export-asr.mjs "out/$OUT.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/el34-export-asr.mjs "out/$OUT-mobile.mp4" | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/verify-el34.mjs "out/$OUT.mp4"
          node scripts/verify-el34.mjs "out/$OUT-mobile.mp4" --mobile
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-extra-line-34-mp4
          path: out/balago-34-extra-line.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload mobile MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-extra-line-34-mobile-mp4
          path: out/balago-34-extra-line-mobile.mp4
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: balago-extra-line-34-*mp4
          merge-multiple: true
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: extra-line-34-preview
        run: |
          ls -la out
          NOTES="BalaGo34ExtraLine (№34) — предварительный просмотр. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №34 «Жарыядагы ашыкча сап» — 2D (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$OUT.mp4" "out/$OUT-mobile.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-mobile.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
