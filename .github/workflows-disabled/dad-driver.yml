name: BalaGo32DadDriver (№32 «Атам — айдоочу»)

# Ролик №32 в 2D: «Папа — водитель». Собирается только эта композиция.
#   voice   → этап из src/dad-driver/script.ts (DD_VOICE_STAGE):
#             samples — короткие пробы голосов в voice-samples/dad-driver/;
#             full    — все реплики (3 дубля новой реплики, лучший по
#             распознаванию MMS) в public/audio/dad-driver/.
#             Новые файлы сохраняются в ветку; готовые не синтезируются.
#   render  → только при полной озвучке и по запросу (Run workflow с
#             render = true или «[render]» в сообщении коммита): lint,
#             тесты, контрольные кадры, MP4 1080×1920 и копия 540×960
#             (faststart), проверка формата, длительности и звука.
#   publish → оба MP4 — файлами предварительного релиза dad-driver-preview.

on:
  push:
    paths:
      - "src/dad-driver/**"
      - "src/BalaGo32DadDriver.tsx"
      - "scripts/*dd*"
      - "scripts/lib/dd-*"
      - ".github/workflows/dad-driver.yml"
  workflow_dispatch:
    inputs:
      render:
        description: "Собрать MP4 (нужна полная озвучка)"
        type: boolean
        default: true

concurrency:
  group: dad-driver-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-32-dad-driver

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Voice stage
        id: stage
        run: |
          STAGE=$(node -e 'import("./src/dad-driver/script.ts").then(m => console.log(m.DD_VOICE_STAGE))')
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Этап озвучки: $STAGE"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ts2d-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/requirements-ts2d-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      # Реплики с тем же хэшем текста, тега, голоса, модели, настроек и seed
      # переиспользуются без обращения к API.
      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generate-dd-voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          for d in public/audio/dad-driver voice-samples/dad-driver; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save dad-driver voice files (${{ steps.stage.outputs.stage }})"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload voice files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-32-dad-driver-voice
          path: |
            public/audio/dad-driver/
            voice-samples/dad-driver/
          if-no-files-found: ignore
          retention-days: 30

  render:
    needs: voice
    if: >-
      needs.voice.outputs.stage == 'full' &&
      ((github.event_name == 'workflow_dispatch' && inputs.render) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[render]')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Голова ветки: в ней уже сохранённые задачей voice файлы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npm run lint

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (timeline, voice files, texts)
        env:
          DD_STRICT_VOICE: "1"
        run: npm run test:dad-driver

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Bundle
        run: npm run bundle

      - name: Render check frames
        run: npm run stills:dad-driver

      - name: Render MP4 (H.264/AAC, yuv420p)
        run: npm run render:dad-driver -- --log=warn

      - name: Faststart + mobile copy (540×960) + subtitles
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile.mp4"
          node scripts/dd-srt.mjs "out/$OUT.srt"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/verify-dd.mjs "out/$OUT.mp4" --faststart
          node scripts/verify-dd.mjs "out/$OUT-mobile.mp4" --mobile --faststart
          ls -la out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-32-dad-driver-mp4
          path: |
            out/balago-32-dad-driver.mp4
            out/balago-32-dad-driver.srt
            out/balago-32-dad-driver.vtt
          if-no-files-found: error
          retention-days: 30

      - name: Upload mobile MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-32-dad-driver-mobile-mp4
          path: out/balago-32-dad-driver-mobile.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-32-dad-driver-frames
          path: out/frames-dad-driver/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: balago-32-dad-driver-*mp4
          merge-multiple: true
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dad-driver-preview
        run: |
          ls -la out
          NOTES="BalaGo32DadDriver (№32 «Атам — айдоочу») — предварительный просмотр. Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №32 — Атам айдоочу (предпросмотр)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "out/$OUT.mp4" "out/$OUT-mobile.mp4" "out/$OUT.srt" "out/$OUT.vtt"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-mobile.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.srt"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.vtt"
          } >> "$GITHUB_STEP_SUMMARY"
