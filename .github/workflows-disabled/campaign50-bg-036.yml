name: BalaGo-50 BG-036 (выпуск №36, 2D)

# Выпуск №36 / BG-036 «Кыркка дагы беш». Собирается ТОЛЬКО композиция
# BalaGoBG036 из собственной точки входа src/campaign50/bg-036/index.ts
# (общие src/Root.tsx, src/index.ts и прежние ролики не участвуют).
# Массовый render.yml эти пути игнорирует (paths-ignore: src/campaign50/**,
# scripts/campaign50/**, public/*/campaign50/**, campaign50-*.yml).
#   voice   → реплики ElevenLabs готовым кыргызским голосом диктора проекта
#             (3 дубля, лучший по распознаванию MMS); сохранённые MP3 по
#             хэшу повторно не запрашиваются, новые коммитятся в ветку.
#   checks  → lint/TypeScript, проверки сценария, контрольные кадры
#             (сцены, реплики, 0/25/50/75/100 %) — на каждый пуш.
#   render  → ОДИН целевой рендер MP4 1080×1920 30 fps H.264/AAC + мобильная
#             копия 540×960 (обе с faststart) и проверка файлов — только
#             если заголовок коммита НАЧИНАЕТСЯ с «[final]» (или ручной запуск).
#   Все задачи после voice собирают один и тот же коммит — голову ветки
#   сразу после сохранения озвучки (выход voice.sha), а не то, что окажется
#   в ветке позже.
#   publish → оба MP4 файлами предварительного релиза bg-036-preview
#             (прямые ссылки на MP4).

on:
  push:
    branches:
      - "feature/bg-036-episode-36"
    paths:
      - "src/campaign50/bg-036/**"
      - "scripts/campaign50/bg-036/**"
      - "public/audio/campaign50/bg-036/**"
      - "public/assets/campaign50/bg-036/**"
      - ".github/workflows/campaign50-bg-036.yml"
  workflow_dispatch:

# Финальный запуск — в своей очереди: обычный пуш не вытеснит ожидающий финал.
concurrency:
  group: campaign50-bg-036-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, '[final]') && 'final' || 'ci' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: balago-bg-036
  ENTRY: src/campaign50/bg-036/index.ts
  COMP: BalaGoBG036

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Script checks before paid voice (verbatim VO, Bishkek, both contacts)
        run: node --test scripts/campaign50/bg-036/check.test.mjs

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/campaign50/bg-036/requirements-asr.txt

      - name: Install MMS speech recognition
        run: pip install --quiet -r scripts/campaign50/bg-036/requirements-asr.txt

      - name: Cache MMS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-1b-all-v1

      - name: Voiceover (cached lines are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/campaign50/bg-036/voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/campaign50/bg-036/voice ]; then git add public/audio/campaign50/bg-036/voice; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save BG-036 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Commit to build (contains the voice files)
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload voice files
        if: always() && hashFiles('public/audio/campaign50/bg-036/voice/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-036-voice
          path: public/audio/campaign50/bg-036/voice/
          retention-days: 30

  checks:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Коммит с сохранённой задачей voice озвучкой.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript
        run: npx eslint src/campaign50/bg-036 && npx tsc

      - name: Script checks (Kyrgyz text, CTA, timeline, voice)
        env:
          BG36_STRICT_VOICE: "1"
        run: node --test scripts/campaign50/bg-036/check.test.mjs

      - name: Voice summary (CER per line)
        run: |
          node -e '
            const m = require("./public/audio/campaign50/bg-036/voice/manifest.json");
            for (const l of m.lines) console.log(`${l.id}: ${l.durationSec}s, CER ${l.asrCer}, takes ${JSON.stringify(l.takes ?? [])} — «${l.asrHeard ?? ""}»`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render check frames
        run: node scripts/campaign50/bg-036/stills.mjs --voice

      - name: Upload check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-036-frames
          path: out/frames-bg-036/*.png
          if-no-files-found: warn
          retention-days: 30

  render:
    needs: [voice, checks]
    if: startsWith(github.event.head_commit.message, '[final]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.voice.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render MP4 (H.264/AAC, yuv420p, 1080×1920, 30 fps)
        run: |
          npx remotion render "$ENTRY" "$COMP" "out/$OUT.mp4" \
            --codec=h264 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac \
            --props='{"requireVoice":true}' --log=warn

      - name: Faststart + mobile copy (540×960)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" -c copy -movflags +faststart "out/$OUT-fs.mp4"
          mv "out/$OUT-fs.mp4" "out/$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "out/$OUT.mp4" \
            -vf scale=540:960:flags=lanczos -r 30 -c:v libx264 -profile:v high -preset slow -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
            "out/$OUT-mobile.mp4"

      - name: Verify MP4 files (fail if missing or wrong format)
        run: |
          node scripts/campaign50/bg-036/verify.mjs "out/$OUT.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/campaign50/bg-036/verify.mjs "out/$OUT-mobile.mp4" --mobile | tee -a "$GITHUB_STEP_SUMMARY"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 "out/$OUT.mp4"

      - name: Frames 0/25/50/75/100 % from the real MP4
        run: |
          mkdir -p out/mp4-frames
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$OUT.mp4")
          for p in 0 25 50 75 100; do
            T=$(node -e "const d=$D; console.log(Math.max(0, Math.min(d - 0.05, d * $p / 100)).toFixed(3))")
            ffmpeg -hide_banner -loglevel error -y -ss "$T" -i "out/$OUT.mp4" -frames:v 1 "out/mp4-frames/pct-$p.png"
          done
          ls -la out/mp4-frames

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-036-mp4
          path: out/balago-bg-036.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload mobile MP4
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-036-mobile-mp4
          path: out/balago-bg-036-mobile.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload MP4 frames
        uses: actions/upload-artifact@v4
        with:
          name: balago-bg-036-mp4-frames
          path: out/mp4-frames/*.png
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [voice, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: balago-bg-036-*mp4
          merge-multiple: true
          path: out

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bg-036-preview
        run: |
          ls -la out
          sha256sum out/*.mp4
          SHA="${{ needs.voice.outputs.sha }}"
          NOTES="BalaGo №36 BG-036 «Кыркка дагы беш» (40 + 5 толук сапар) — финальный рендер 1080×1920, 30 fps, H.264/AAC и мобильная копия 540×960. Ещё не принят владельцем. Ветка ${GITHUB_REF_NAME}, коммит ${SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          # релиз пересоздаётся, чтобы тег указывал ровно на собранный коммит
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BalaGo №36 BG-036 «Кыркка дагы беш» — 2D" --notes "$NOTES" --prerelease --target "$SHA" \
            "out/$OUT.mp4" "out/$OUT-mobile.mp4"
          {
            echo "### MP4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT.mp4"
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$OUT-mobile.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
