name: Lesson80-1-2-WhatIsInsideApple (lesson-80, 80-1-2, 16:9)

# «Урок 1. Аллах — наш Создатель. Анимация 2: Что спрятано в яблоке?»
#   voice → озвучка 43 реплик ElevenLabs (готовые дубли не синтезируются);
#           новые файлы сохраняются в ветку.
# Видео (≈7800 кадров 1920×1080) рендерится локально:
#   npm run render:80-1-2 → out/lesson-80-1-2-what-is-inside-apple-16x9.mp4

on:
  push:
    paths:
      - "src/lesson80-1-2/script.ts"
      - "src/lesson80-1-2/voices.json"
      - "scripts/lesson80-1-2-voice.mjs"
      - ".github/workflows/lesson80-1-2.yml"
  workflow_dispatch:

concurrency:
  group: lesson80-1-2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Voiceover (cached takes are reused)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/lesson80-1-2-voice.mjs

      - name: Save new voice files to the branch
        if: always() && github.ref_name != 'main'
        run: |
          if [ -d public/audio/lesson80-1-2 ]; then git add public/audio/lesson80-1-2; fi
          if git diff --cached --quiet; then
            echo "Новых файлов озвучки нет."
            exit 0
          fi
          git diff --cached --stat | tail -3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save lesson 80-1-2 voice files"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
